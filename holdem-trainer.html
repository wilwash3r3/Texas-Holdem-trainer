state.preflop = { format:'6max', seat:'utg', deck:'standard', drill:{active:false, question:null, score:0, total:0}, facing:{active:false, question:null, score:0, total:0, vsOpener:null} };

// 3-bet zone scales with the OPENER's range width: a raise from a tight early seat represents
// a stronger average holding, so a smaller top slice is worth re-raising for value; a raise from
// a wide late seat is easier to isolate, so the value 3-bet zone widens. Clamped to [3%,12%] and
// never allowed to exceed the responder's own continuing range (keeps 3bet ⊆ continue always true).
function threeBetPctFor(openerPct, responderPct){
  const raw = Math.min(12, Math.max(3, openerPct * 0.2));
  return Math.min(raw, responderPct);
}

// A small, fixed set of hands with good properties as 3-bet BLUFFS even though they're too weak
// to continue for value: suited wheel aces (A5s-A2s) block opponents' big aces and still have
// straight/flush potential if called; suited one-gap/connectors (65s-98s) play well disguised if
// called. This is a deliberately simple, fixed selection — not solved, just illustrative of the idea
// that 3-bet ranges are polarized (strong hands + a few well-chosen bluffs), not just "strong hands."
const BLUFF_3BET_LABELS = ['A5s','A4s','A3s','A2s','76s','65s','98s','87s'];

function isBluffThreeBet(type, responderPct){
  return type.cumPct > responderPct && BLUFF_3BET_LABELS.includes(type.label);
}

function classifyFacingRaise(type, responderPct, openerPct){
  const threeBetPct = threeBetPctFor(openerPct, responderPct);
  if(type.cumPct<=threeBetPct) return '3bet';
  if(type.cumPct<=responderPct) return 'call';
  if(isBluffThreeBet(type, responderPct)) return '3bet';
  return 'fold';
}
function threeBetKind(type, responderPct, openerPct){
  return type.cumPct <= threeBetPctFor(openerPct, responderPct) ? 'value' : 'bluff';
}

function currentSeats(){ return POSITION_FORMATS[state.preflop.format].seats; }
function currentSeatObj(){ return currentSeats().find(s=>s.id===state.preflop.seat) || currentSeats()[0]; }
function openerCandidatesFor(responderId){
  const seats = currentSeats();
  const idx = seats.findIndex(s=>s.id===responderId);
  if(idx<=0) return [];
  return seats.slice(0, idx).filter(s=>s.pct!=null);
}

function renderRangeGrid(seatPct, deckMode){
  if(deckMode==='shortdeck'){
    const RANKS=[14,13,12,11,10,9,8,7,6];
    const map = shortDeckHandTypeMap();
    let rows='';
    for(let i=0;i<9;i++){
      let cols='';
      for(let j=0;j<9;j++){
        let label;
        if(i===j) label = chLabel(RANKS[i])+chLabel(RANKS[i]);
        else if(i<j) label = chLabel(RANKS[i])+chLabel(RANKS[j])+'s';
        else label = chLabel(RANKS[j])+chLabel(RANKS[i])+'o';
        const t = map[label];
        const inRange = seatPct!=null && t.cumPct<=seatPct;
        cols += `<div class="range-cell${inRange?' in':''}" title="Empirical equity ${(t.equity*100).toFixed(1)}%">${label}</div>`;
      }
      rows += `<div class="range-row">${cols}</div>`;
    }
    return `<div class="range-grid">${rows}</div>`;
  }
  const RANKS=[14,13,12,11,10,9,8,7,6,5,4,3,2];
  let rows='';
  for(let i=0;i<13;i++){
    let cols='';
    for(let j=0;j<13;j++){
      let label;
      if(i===j) label = chLabel(RANKS[i])+chLabel(RANKS[i]);
      else if(i<j) label = chLabel(RANKS[i])+chLabel(RANKS[j])+'s';
      else label = chLabel(RANKS[j])+chLabel(RANKS[i])+'o';
      const t = HAND_TYPE_MAP[label];
      const inRange = seatPct!=null && t.cumPct<=seatPct;
      cols += `<div class="range-cell${inRange?' in':''}" title="Chen score ${t.score}">${label}</div>`;
    }
    rows += `<div class="range-row">${cols}</div>`;
  }
  return `<div class="range-grid">${rows}</div>`;
}

function newPositionDrillQuestion(deckMode){
  const seats = currentSeats().filter(s=>s.pct!=null);
  const seat = seats[Math.floor(Math.random()*seats.length)];
  const pool = deckMode==='shortdeck' ? getShortDeckHandTypes() : HAND_TYPES;
  const type = pool[Math.floor(Math.random()*pool.length)];
  const correct = type.cumPct<=seat.pct ? 'raise' : 'fold';
  return {seat, type, hi:type.hi, lo:type.lo, suited:type.suited, label:type.label, correct, answered:false, userChoice:null};
}

function renderFacingRaiseGrid(responderPct, openerPct){
  const RANKS=[14,13,12,11,10,9,8,7,6,5,4,3,2];
  let rows='';
  for(let i=0;i<13;i++){
    let cols='';
    for(let j=0;j<13;j++){
      let label;
      if(i===j) label = chLabel(RANKS[i])+chLabel(RANKS[i]);
      else if(i<j) label = chLabel(RANKS[i])+chLabel(RANKS[j])+'s';
      else label = chLabel(RANKS[j])+chLabel(RANKS[i])+'o';
      const t = HAND_TYPE_MAP[label];
      const cls = classifyFacingRaise(t, responderPct, openerPct);
      let clsName = '';
      if(cls==='3bet') clsName = threeBetKind(t, responderPct, openerPct)==='bluff' ? 'fr-3bet-bluff' : 'fr-3bet';
      else if(cls==='call') clsName = 'fr-call';
      cols += `<div class="range-cell ${clsName}" title="${label}: ${cls}">${label}</div>`;
    }
    rows += `<div class="range-row">${cols}</div>`;
  }
  return `<div class="range-grid">${rows}</div>`;
}

function newFacingRaiseQuestion(){
  const seats = currentSeats();
  const responderCandidates = seats.filter((s,i)=> s.pct!=null && i>=1 && openerCandidatesFor(s.id).length>0);
  const seat = responderCandidates[Math.floor(Math.random()*responderCandidates.length)];
  const openers = openerCandidatesFor(seat.id);
  const opener = openers[Math.floor(Math.random()*openers.length)];
  const type = HAND_TYPES[Math.floor(Math.random()*HAND_TYPES.length)];
  const correct = classifyFacingRaise(type, seat.pct, opener.pct);
  const kind = correct==='3bet' ? threeBetKind(type, seat.pct, opener.pct) : null;
  return {seat, opener, type, correct, kind, threeBetPct: threeBetPctFor(opener.pct, seat.pct), answered:false, userChoice:null};
}

/* =========================================================
   RANGE READING — combo counting with blockers
   Builds directly on the Chen-ranked hand types from Preflop
   Position: a "range" is just the set of hand-types at or above
   a seat's opening cutoff. This section teaches how SEEING cards
   (your hole cards, and eventually board cards) removes specific
   combinations from an opponent's possible range — the core skill
   behind reading ranges at the table.
   ========================================================= */
function availableSuitsForRank(r, deadCards){
  return SUITS.filter(s=> !deadCards.some(c=>c.r===r && c.s===s));
}
function comboCount(type, deadCards){
  if(type.isPair){
    const avail = availableSuitsForRank(type.hi, deadCards);
    return avail.length>=2 ? avail.length*(avail.length-1)/2 : 0;
  }
  const availHi = availableSuitsForRank(type.hi, deadCards);
  const availLo = availableSuitsForRank(type.lo, deadCards);
  const inter = availHi.filter(s=>availLo.includes(s)).length;
  if(type.suited) return inter;
  return availHi.length*availLo.length - inter;
}
function rangeComboSummary(seatPct, deadCards){
  let baseTotal=0, remainTotal=0;
  HAND_TYPES.forEach(t=>{
    if(t.cumPct<=seatPct){ baseTotal += t.combos; remainTotal += comboCount(t, deadCards); }
  });
  return {baseTotal, remainTotal};
}

}

function renderRangeGridWithCombos(seatPct, deadCards){
  const RANKS=[14,13,12,11,10,9,8,7,6,5,4,3,2];
  let rows='';
  for(let i=0;i<13;i++){
    let cols='';
    for(let j=0;j<13;j++){
      let label;
      if(i===j) label = chLabel(RANKS[i])+chLabel(RANKS[i]);
      else if(i<j) label = chLabel(RANKS[i])+chLabel(RANKS[j])+'s';
      else label = chLabel(RANKS[j])+chLabel(RANKS[i])+'o';
      const t = HAND_TYPE_MAP[label];
      const inRange = t.cumPct<=seatPct;
      if(inRange){
        const cnt = comboCount(t, deadCards);
        const ratio = t.combos>0 ? cnt/t.combos : 0;
        const cls = 'range-cell in' + (cnt===0?' blocked':'');
        const op = cnt===0 ? 1 : (0.5+0.5*ratio);
        cols += `<div class="${cls}" style="opacity:${op}" title="${label}: ${cnt}/${t.combos} combos remain">${label}<span class="rc-count">${cnt}</span></div>`;
      } else {
        cols += `<div class="range-cell" title="${label}: not in range">${label}</div>`;
      }
    }
    rows += `<div class="range-row">${cols}</div>`;
  }
  return `<div class="range-grid combos">${rows}</div>`;
}

function buildComboOptions(correctCount, maxCombos){
  const pool = new Set([correctCount, maxCombos]);
  [-2,-1,1,2].forEach(d=>{ const v=correctCount+d; if(v>=0 && v<=maxCombos) pool.add(v); });
  let arr = shuffle([...pool]).slice(0, Math.min(4, pool.size));
  if(!arr.includes(correctCount)) arr[0]=correctCount;
  return shuffle(arr);
}

function generateRangeDrillQuestion(){
  const formats = Object.keys(POSITION_FORMATS);
  const format = formats[Math.floor(Math.random()*formats.length)];
  const seats = POSITION_FORMATS[format].seats.filter(s=>s.pct!=null);
  const seat = seats[Math.floor(Math.random()*seats.length)];
  const deck = shuffle(buildDeck());
  const hero = [deck.pop(), deck.pop()];
  const streetRoll = Math.random();
  const boardCount = streetRoll<0.4 ? 0 : streetRoll<0.7 ? 3 : streetRoll<0.9 ? 4 : 5;
  const board = []; for(let i=0;i<boardCount;i++) board.push(deck.pop());
  const dead = hero.concat(board);
  const inRangeTypes = HAND_TYPES.filter(t=>t.cumPct<=seat.pct);
  const type = inRangeTypes[Math.floor(Math.random()*inRangeTypes.length)];
  const correctCount = comboCount(type, dead);
  const options = buildComboOptions(correctCount, type.combos);
  return {format, seat, hero, board, type, correctCount, options, answered:false, userChoice:null};
}

/* =========================================================
   BET SIZING & BLUFFING — balanced ranges
   The key numbers here mirror the Pot Odds & Equity tab exactly:
   the bettor's optimal bluff frequency (as a share of their total
   betting range) equals the caller's required equity to call —
   same formula, opposite side of the table. Both depend only on
   the bet-to-pot RATIO, not the absolute pot size.
   ========================================================= */
function bluffFreqGeneral(r, q){
  // Generalizes the pure-bluff formula to bluffs that keep some equity when called
  // (semi-bluffs, e.g. a flush draw). At q=0 this is identical to the pure-bluff case.
  q = q || 0;
  const f = r / ((1-q) * (1+2*r));
  return Math.min(f, 1); // clamp: at extreme q/r combinations the linear model can exceed 100%
}
function bluffRatioGeneral(r, q){
  const f = bluffFreqGeneral(r, q);
  return f/(1-f);
}
function bluffFreqFromRatio(r){ return bluffFreqGeneral(r, 0); }       // bettor's optimal bluff % of total range
function bluffValueRatioFromRatio(r){ return bluffRatioGeneral(r, 0); } // bluff combos per 1 value combo

const BET_SIZE_OPTIONS = [
  {label:'33% pot', pct:0.33}, {label:'50% pot', pct:0.5}, {label:'66% pot', pct:0.66},
  {label:'75% pot', pct:0.75}, {label:'Pot (100%)', pct:1.0}, {label:'150% pot', pct:1.5}, {label:'2x pot', pct:2.0},
];
const EQUITY_OPTIONS = [
  {label:'Pure air (0%)', q:0}, {label:'Weak draw (~15%)', q:0.15},
  {label:'Medium draw (~25%)', q:0.25}, {label:'Strong draw (~35%)', q:0.35},
];

state.bluff = { pct:0.66, equity:0, drill:{active:false, question:null, score:0, total:0} };

function buildNearbyOptions(correct, max){
  const pool = new Set([correct]);
  [-3,-2,-1,1,2,3].forEach(d=>{ const v=correct+d; if(v>=0 && (max===undefined || v<=max)) pool.add(v); });
  let arr = shuffle([...pool]).slice(0, Math.min(4, pool.size));
  if(!arr.includes(correct)) arr[0]=correct;
  return shuffle(arr);
}

function generateBluffDrillQuestion(){
  const size = BET_SIZE_OPTIONS[Math.floor(Math.random()*BET_SIZE_OPTIONS.length)];
  const equity = EQUITY_OPTIONS[Math.floor(Math.random()*EQUITY_OPTIONS.length)];
  const valueCombos = 4 + Math.floor(Math.random()*20); // 4..23
  const ratio = bluffRatioGeneral(size.pct, equity.q);
  const correctBluffCombos = Math.round(valueCombos * ratio);
  const options = buildNearbyOptions(correctBluffCombos);
  return {size, equity, valueCombos, ratio, correctBluffCombos, options, answered:false, userChoice:null};
}

   FULL SKILLS TEST — a combined, graded assessment spanning 5 of the
   trainer's skill areas, the Hold'em analogue of Blackjack's Test mode.
   Rather than trying to reuse each tab's own render function (each has
   different UI, different state shape, different explain-box layout),
   every topic gets a small adapter that normalizes its existing —
   already-tested — generator into one common shape: {topic, prompt,

function skillsTestFromTerminology(){

function skillsTestFromPotOdds(){
  const potBefore = [20,30,50,75,100][Math.floor(Math.random()*5)];
  const bet = Math.round(potBefore * (0.33 + Math.random()*0.9));
  const requiredEquity = bet/(potBefore + bet*2);
  const correct = Math.round(requiredEquity*100);
  const pool = new Set([correct, Math.round(bet/potBefore*100), Math.round(bet/(potBefore+bet)*100), correct+10]);
  let vals = shuffle([...pool]).slice(0, Math.min(4, pool.size));
  if(!vals.includes(correct)) vals[0] = correct;
  vals = shuffle(vals);
  const choices = vals.map(v=>`~${v}%`);
  return { topic:'Pot Odds', prompt:`Pot is $${potBefore}, you face a $${bet} bet. What's the minimum equity you need to profitably call?`, choices, correctIndex:choices.indexOf(`~${correct}%`) };
}

const SKILLS_TEST_LENGTH = 15;
const SKILLS_TEST_GENERATORS = [skillsTestFromTerminology, skillsTestFromPotOdds, skillsTestFromPosition, skillsTestFromRanges, skillsTestFromBluff];
function generateSkillsTest(){
  const questions = [];
  for(let i=0;i<SKILLS_TEST_LENGTH;i++){
    const gen = SKILLS_TEST_GENERATORS[Math.floor(Math.random()*SKILLS_TEST_GENERATORS.length)];
    questions.push(gen());
  }
  return questions;
}

state.skillsTest = { active:false, questions:null, index:0, score:0, answered:false, userChoice:null, bestScore:0, bestTotal:0, bestPct:0 };

function renderSkillsTest(){
  const st = state.skillsTest;
  if(!st.active){
    return `
      <div class="card-box">
        <h2>Full Skills Test</h2>
        <div class="muted">A ${SKILLS_TEST_LENGTH}-question graded test pulling randomly from Terminology, Pot Odds, Preflop Position, Range Reading, and Bet Sizing &amp; Bluffing — the exact same generators and correctness logic as those tabs, just interleaved into one timed run.</div>
        ${st.bestTotal>0 ? `<div class="pill" style="margin-top:12px;">Best score: ${st.bestScore} / ${st.bestTotal} (${st.bestPct}%)</div>` : ''}
        <div class="btn-row" style="margin-top:14px;">
          <button class="btn primary" id="btnStartSkillsTest">Start Test</button>
        </div>
      </div>`;
  }
  if(st.index >= st.questions.length){
    const pct = Math.round((st.score/st.questions.length)*100);
    const isNewBest = st.score > st.bestScore || (st.score===st.bestScore && st.questions.length>st.bestTotal);
    return `
      <div class="card-box" style="text-align:center;">
        <h2>Test Complete</h2>
        <div class="muted" style="font-size:1.1rem; margin:10px 0;">You scored <b style="color:var(--gold-bright);">${st.score} / ${st.questions.length}</b> (${pct}%)</div>
        ${isNewBest ? `<div class="pill" style="background:var(--gold); color:#20200c; border-color:var(--gold-bright);">New Best Score!</div>` : `<div class="pill">Best score: ${st.bestScore} / ${st.bestTotal} (${st.bestPct}%)</div>`}
        <div class="btn-row" style="justify-content:center; margin-top:16px;">
          <button class="btn primary" id="btnRetakeSkillsTest">Take Test Again</button>
        </div>
      </div>`;
  }
  const q = st.questions[st.index];
  return `
    <div class="card-box">
      <h2>Full Skills Test</h2>
      <div class="muted">Question ${st.index+1} of ${st.questions.length} &middot; Score so far: ${st.score}</div>
      <div class="pill" style="margin-top:10px;">${q.topic}</div>
      <div style="margin-top:10px; font-size:1rem;">${q.prompt}</div>
      <div class="btn-row" style="margin-top:12px;">
        ${q.choices.map((c,i)=>`<button class="btn drill-answer${st.answered?(i===q.correctIndex?' primary':''):''}" data-testopt="${i}" ${st.answered?'disabled':''}>${c}</button>`).join('')}
      </div>
      ${st.answered ? `
        <div class="explain-box">
          <div style="color:${st.userChoice===q.correctIndex?'var(--good)':'var(--bad)'}">You chose "${q.choices[st.userChoice]}" — correct answer was "${q.choices[q.correctIndex]}" — ${st.userChoice===q.correctIndex?'correct!':'not quite.'}</div>
        </div>
        <div class="btn-row"><button class="btn primary drill-next" id="btnSkillsTestNext">${st.index+1>=st.questions.length?'See Results':'Next Question'}</button></div>
      ` : ''}
    </div>`;
}

function wireSkillsTestEvents(){
  const startBtn = document.getElementById('btnStartSkillsTest');
  if(startBtn) startBtn.addEventListener('click', ()=>{
    const st = state.skillsTest;
    st.active = true; st.questions = generateSkillsTest(); st.index = 0; st.score = 0; st.answered = false; st.userChoice = null;
    render();
  });
  const retakeBtn = document.getElementById('btnRetakeSkillsTest');
  if(retakeBtn) retakeBtn.addEventListener('click', ()=>{
    const st = state.skillsTest;
    st.active = true; st.questions = generateSkillsTest(); st.index = 0; st.score = 0; st.answered = false; st.userChoice = null;
    render();
  });
  document.querySelectorAll('[data-testopt]').forEach(btn=>btn.addEventListener('click', ()=>{
    const st = state.skillsTest;
    if(st.answered) return;
    const q = st.questions[st.index];
    const choice = parseInt(btn.dataset.testopt,10);
    st.answered = true; st.userChoice = choice;
    if(choice===q.correctIndex) st.score++;
    recordDrillAnswer(choice===q.correctIndex);
    choice===q.correctIndex ? sfxCorrect() : sfxWrong();
    render();
  }));
  const nextBtn = document.getElementById('btnSkillsTestNext');
  if(nextBtn) nextBtn.addEventListener('click', ()=>{
    const st = state.skillsTest;
    st.index++;
    st.answered = false; st.userChoice = null;
    if(st.index >= st.questions.length){
      if(st.score > st.bestScore || st.bestTotal===0 || (st.score===st.bestScore && st.questions.length>st.bestTotal)){
        st.bestScore = st.score; st.bestTotal = st.questions.length; st.bestPct = Math.round((st.score/st.questions.length)*100);
      }
    }
    render();
  });
}

    {label:'Terminology', score:state.quiz.score, total:state.quiz.total},

function renderAchievementsList(){
  if(!state.lifetime) state.lifetime = newLifetimeState();
  const lt = state.lifetime;
  const justEarnedIds = lt.justEarned || [];
  lt.justEarned = null; // shown once, then cleared — same "consume on render" pattern used elsewhere
  const earnedCount = ACHIEVEMENTS.filter(a=>lt.earned[a.id]).length;
  const rows = ACHIEVEMENTS.map(a=>{
    const earned = !!lt.earned[a.id];
    const isNew = justEarnedIds.includes(a.id);
    const hidden = !!a.secret && !earned; // secret achievements stay a mystery until unlocked
    const displayName = hidden ? '???' : a.name;
    const displayDesc = hidden ? 'A secret achievement. Keep playing to discover it.' : a.desc;
    return `
      <div class="pill" style="${earned?'background:var(--gold); color:#20200c; border-color:var(--gold-bright);':'opacity:0.5;'} display:flex; flex-direction:column; align-items:flex-start; padding:8px 12px; margin:4px 6px 4px 0;">
        <div style="font-weight:700;">${earned?'\u2713':'\ud83d\udd12'} ${displayName}${isNew?' <span style="color:var(--good);">NEW!</span>':''}</div>
        <div style="font-size:0.72rem; ${earned?'color:#3a3616;':'color:var(--cream-dim);'}">${displayDesc}</div>
      </div>`;
  }).join('');
  return `
    <div class="muted" style="margin-bottom:8px;">${earnedCount} / ${ACHIEVEMENTS.length} earned</div>
    <div style="display:flex; flex-wrap:wrap;">${rows}</div>`;
}

/* =========================================================
   HOLD'EM VARIANTS — the real casino betting-structure/deck
   variations of Texas Hold'em beyond No-Limit.
   ========================================================= */
function maxRaiseTotalFromScenario(potBefore, bet){
  // Mirrors maxPotRaiseTotal() exactly. potBefore is the pot BEFORE villain's bet, so the pot
  // AS SEEN BY HERO (after villain's bet lands) is potBefore+bet — that's the "P" in the standard
  // P+2C rule, where C (the call) equals bet here. With hero having $0 in yet this street:
  // maxRaiseTotal = (potBefore+bet) + 2*bet = potBefore + 3*bet.
  return potBefore + 3*bet;
}

function generateMaxRaiseQuestion(){
  const potBefore = [20,30,50,75,100,150,200][Math.floor(Math.random()*7)];
  const bet = Math.max(5, Math.round(potBefore * (0.4+Math.random()*1.1) / 5) * 5);
  const correct = maxRaiseTotalFromScenario(potBefore, bet);
  // Distractors reflect real, common misconceptions rather than arbitrary noise:
  const pool = new Set([
    correct,
    potBefore + bet,        // "call then bet the pot" — forgets to double the call
    potBefore,               // ignores the bet entirely
    bet*2,                   // some other plausible guess
  ]);
  let opts = shuffle([...pool]).slice(0, Math.min(4, pool.size));
  if(!opts.includes(correct)) opts[0] = correct;
  opts = shuffle(opts);
  return {potBefore, bet, correct, options:opts, answered:false, userChoice:null};
}

function generateLimitSizeQuestion(){
  const bigBlind = [2,5,10,20][Math.floor(Math.random()*4)];
  const streets = ['Preflop','Flop','Turn','River'];
  const street = streets[Math.floor(Math.random()*streets.length)];
  const correct = (street==='Preflop'||street==='Flop') ? bigBlind : bigBlind*2;
  const pool = new Set([correct, bigBlind, bigBlind*2, bigBlind*4]);
  let opts = shuffle([...pool]).slice(0, Math.min(4, pool.size));
  if(!opts.includes(correct)) opts[0] = correct;
  opts = shuffle(opts);
  return {bigBlind, street, correct, options:opts, answered:false, userChoice:null};
}

function generateShortDeckRankingQuestion(){
  const RANKS_SD = [6,7,8,9,10,11,12,13,14];
  const suit = SUITS[Math.floor(Math.random()*4)];
  let flushRanks;
  do {
    flushRanks = [];
    while(flushRanks.length<5){
      const r = RANKS_SD[Math.floor(Math.random()*RANKS_SD.length)];
      if(!flushRanks.includes(r)) flushRanks.push(r);
    }
    flushRanks.sort((a,b)=>b-a);
  } while(flushRanks[0]-flushRanks[4]===4); // avoid accidentally building a straight flush
  const flushCards = flushRanks.map(r=>({r, s:suit}));

  const tripsRank = RANKS_SD[Math.floor(Math.random()*RANKS_SD.length)];
  let pairRank;
  do { pairRank = RANKS_SD[Math.floor(Math.random()*RANKS_SD.length)]; } while(pairRank===tripsRank);
  const tripsSuits = shuffle(['s','h','d','c']).slice(0,3);
  const pairSuits = shuffle(['s','h','d','c']).slice(0,2);
  const fullHouseCards = [...tripsSuits.map(s=>({r:tripsRank,s})), ...pairSuits.map(s=>({r:pairRank,s}))];

  const flushIsA = Math.random()<0.5;
  const playerA = flushIsA ? {cards:flushCards, label:'Flush'} : {cards:fullHouseCards, label:'Full House'};
  const playerB = flushIsA ? {cards:fullHouseCards, label:'Full House'} : {cards:flushCards, label:'Flush'};
  const correct = flushIsA ? 'A' : 'B';
  return {playerA, playerB, correct, answered:false, userChoice:null};
}

      </div>
    </div>
    ${rankingDrillHTML}`;
}

/* =========================================================

   actually uses, shows the human's own live read at whatever table is
   currently active, and drills the two core exploits directly.

function generateExploitQuestion(){
  const isTight = Math.random() < 0.5;
  const vpipPct = isTight ? (8 + Math.floor(Math.random()*10)) : (38 + Math.floor(Math.random()*20));
  const askAboutBluffing = Math.random() < 0.5;
  const correct = askAboutBluffing ? (isTight ? 'more' : 'less') : (isTight ? 'less' : 'more');
  return {vpipPct, isTight, askAboutBluffing, correct, answered:false, userChoice:null};
}

state.image = { drill:{active:false, question:null, score:0, total:0} };

function renderImage(){
  const d = state.image.drill;
  const t = state.table;
  const read = t ? humanImageRead(t) : null;

  let liveHTML;
  if(!t){
    liveHTML = `<div class="muted">Start a table in Play mode to see your own live image build up here.</div>`;
  } else if(!read){
    const observed = t.humanImage ? t.humanImage.handsObserved : 0;
    liveHTML = `<div class="muted">Not enough hands yet at this table (${observed} of 15 needed) — Hard-mode AI won't start adjusting to you until there's a real sample to read.</div>`;
  } else {
    liveHTML = `
      <div class="pill">VPIP: ${(read.vpipPct*100).toFixed(0)}%${infoIcon('Voluntarily Put money In Pot \u2014 the share of hands where you called or raised preflop by choice, not counting a free look from the blinds. Around 20-28% is typical for a solid player; much lower reads as tight, much higher reads as loose.')}</div>
        <div class="pill">PFR: ${(read.pfrPct*100).toFixed(0)}%${infoIcon('Preflop Raise \u2014 how often you raise preflop specifically, as opposed to just calling. A big gap between VPIP and PFR (calling a lot, raising rarely) is its own tell.')}</div>
        <div class="pill">Postflop AF: ${read.af.toFixed(1)}${infoIcon('Aggression Factor \u2014 your bets and raises postflop divided by your calls. Above 1 means you bet/raise more than you call; well below 1 means you mostly call or check.')}</div>
        <div class="pill">Hands observed: ${read.handsObserved}</div>
        <div class="muted" style="margin-top:8px;">Hard-mode AI is actively adjusting to this read right now.</div>`;
  }

  let drillHTML = '';
  if(d.active){
    if(!d.question) d.question = generateExploitQuestion();
    const q = d.question;
    drillHTML = `
      <div class="card-box" style="margin-top:16px;">
        <h2>Exploits Drill</h2>
        <div class="score-tag">Score: ${d.score} / ${d.total}</div>
        <div class="muted" style="margin-top:8px;">This opponent has a VPIP of <b style="color:var(--gold-bright)">${q.vpipPct}%</b> (a standard, unexploitable player runs around 25%) — noticeably ${q.isTight?'tighter':'looser'} than usual. Should you ${q.askAboutBluffing?'bluff them':'call their bets'} <b>more</b> or <b>less</b> than you normally would?</div>
        <div class="btn-row">
          <button class="btn drill-answer${q.answered?(q.correct==='more'?' primary':''):''}" data-exploitopt="more" ${q.answered?'disabled':''}>More</button>
          <button class="btn drill-answer${q.answered?(q.correct==='less'?' primary':''):''}" data-exploitopt="less" ${q.answered?'disabled':''}>Less</button>
        </div>
        ${q.answered ? `
          <div class="explain-box">
            <div><b>Correct answer:</b> ${q.correct==='more'?'More':'Less'} <span class="muted">(${q.isTight
              ? 'a tight opponent folds too often, so bluffs get through more easily — but their own bets mean more, so respect them and call less'
              : 'a loose opponent calls too much, so bluffs rarely get through — but their bets carry less information, so you can profitably call them down more'})</span></div>
            <div style="margin-top:6px; color:${q.userChoice===q.correct?'var(--good)':'var(--bad)'}">You chose <b>${q.userChoice}</b> — ${q.userChoice===q.correct?'correct!':'not quite.'}</div>

          <div class="btn-row"><button class="btn primary drill-next" id="exploitDrillNext">Next Scenario</button></div>

  return `

      <h2>Table Image &amp; Exploits</h2>
      <div class="muted">Every real opponent builds a read on how you actually play, and adjusts. This is the Hold'em version of what a live pit boss watching your bet sizing does in Blackjack — except here, it's every other player at the table, all the time, and it's a real, teachable skill to manage rather than just avoid.</div>
      <div class="explain-box" style="margin-top:12px;">
        <div>Hard-mode AI tracks your <b>VPIP</b>, <b>PFR</b>, and postflop <b>Aggression Factor</b> at the current table, and genuinely adjusts once it has at least 15 hands of data:</div>

          <li>Read you as <b>loose</b> (high VPIP) &rarr; it calls you down lighter (bluff-catching, since your range is wider) and bluffs you less (you call too much for a bluff to work)</li>

      <h3 style="margin-top:18px; color:var(--gold-bright);">Your Current Table Image</h3>

      <div class="btn-row" style="margin-top:16px;">
        <button class="btn primary" id="toggleExploitDrill">${d.active?'Stop Drill':'Practice Exploits'}</button>

/* =========================================================
   MANUAL
   ========================================================= */
function renderManual(){
  return `
    <div class="card-box">
      <h2>Manual</h2>
      <details class="man-sec" open>
        <summary>What This Trains</summary>
        <p class="muted">This trainer builds four skills in order: reading the <b>terminology</b> fluently, computing <b>pot odds &amp; equity</b> under pressure, reading opponent <b>ranges</b>, and choosing <b>bet sizes and bluff frequencies</b> that stay balanced. Play mode runs all of it together at a real table; the other tabs isolate one skill at a time for drilling.</p>
      </details>
      <details class="man-sec">
        <summary>How To Play (Play mode)</summary>
        <p class="muted">Standard No-Limit Texas Hold'em. Each player gets two hole cards; five community cards are revealed across the Flop (3), Turn (1), and River (1). Best 5-card hand from your 2 + the 5 community cards wins. Betting happens preflop and after each community-card reveal. You can choose Heads-Up, 6-Max, or Full Ring (9) table sizes from the Play tab.</p>
      </details>
      <details class="man-sec">
        <summary>Hand Rankings (high to low)</summary>
        <table class="ref">
          <tr><th>Rank</th><th>Hand</th></tr>
          <tr><td>1</td><td>Straight Flush</td></tr>
          <tr><td>2</td><td>Four of a Kind</td></tr>
          <tr><td>3</td><td>Full House</td></tr>
          <tr><td>4</td><td>Flush</td></tr>
          <tr><td>5</td><td>Straight</td></tr>
          <tr><td>6</td><td>Three of a Kind</td></tr>
          <tr><td>7</td><td>Two Pair</td></tr>
          <tr><td>8</td><td>Pair</td></tr>
          <tr><td>9</td><td>High Card</td></tr>
        </table>
      </details>
      <details class="man-sec">
        <summary>Preflop Position — how the ranges are built</summary>
        <p class="muted">All 169 starting hands are ranked using the <b>Chen Formula</b>, a well-established heuristic (high-card value, pair bonus, suited bonus, gap penalty, connector bonus) that produces a single strength score per hand — e.g. AA scores 20 (the max), AKs scores 12, AKo scores 10, 72o scores &minus;1 (the minimum). Each seat's "opens top X%" is applied against that ranked list by hand-combination count (pairs = 6 combos, suited = 4, offsuit = 12, out of 1,326 total two-card combinations), so wider seats are always a strict superset of tighter seats. The seat percentages themselves (UTG ~10&ndash;15%, up to BTN ~40&ndash;45%) are standard, commonly-cited tight-aggressive teaching frequencies, not a solved-game output.</p>
      </details>
      <details class="man-sec">
        <summary>Range Reading — combo counting</summary>
        <p class="muted">Every hand type has a fixed number of ways it can be dealt: 6 for a pocket pair, 4 for a suited hand, 12 for an offsuit hand. Seeing any card removes combos that require it &mdash; e.g. holding one Ace yourself drops AA from 6 combos to 3 for anyone else. The Range Reading tab computes this exactly (per suit, per rank) rather than approximating it, so the combo counts you see are the real counts, not estimates.</p>
      </details>
      <details class="man-sec">
        <summary>Bet Sizing &amp; Bluffing — where the numbers come from</summary>
        <p class="muted">For a bet of size B into a pot of size P, the bettor's optimal bluff frequency (as a share of their <i>total</i> betting range) is B/(P+2B) &mdash; the exact same formula as the caller's required equity in the Pot Odds &amp; Equity tab. The bluff-to-value combo ratio is B/(P+B). Both depend only on the bet-to-pot ratio, which is why a 100%-pot bet always needs a 33.3% bluff frequency (2:1 value-to-bluff) and a 50%-pot bet always needs 25% (3:1), regardless of the actual dollar amounts on the table.</p>
      </details>
      <details class="man-sec">
        <summary>Hard-Mode AI — how it decides</summary>
        <p class="muted">Standard-mode AI uses a hand-category-and-personality heuristic. Hard mode instead reuses this trainer's own tested subsystems: preflop, it maps each AI to a real seat (UTG..BB) based on dealer rotation and plays the actual Chen-ranked opening range from Preflop Position, plus the opener-aware 3-bet math from Facing A Raise when someone's raised ahead of it. Postflop, it estimates its real equity via the same Monte Carlo method as Pot Odds &amp; Equity (fewer trials \u2014 150 instead of 1200 \u2014 to stay responsive) and compares it to actual pot odds rather than a coarse hand-category proxy.</p>
      </details>
      <details class="man-sec">
        <summary>Tournament Mode — how it works</summary>
        <p class="muted">Single-table, no-rebuy elimination: everyone starts with $${TOURNAMENT_START_STACK} in tournament chips, blinds rise every ${TOURNAMENT_HANDS_PER_LEVEL} hands on a fixed schedule, and busting means you're out for good. Prizes come from a virtual buy-in pool ($${TOURNAMENT_BUY_IN}/player) paid out to the top finishers (6-Max pays 2, Full Ring pays 3) — this is session-only scorekeeping, not a real bankroll. If you bust before the field is down to one, the remaining players keep playing automatically at normal pace so you can watch the rest shake out and see your final placement.</p>
      </details>
      <details class="man-sec">
        <summary>Multi-Table Tournaments — how it works</summary>
        <p class="muted">Your table plays out normally, hand by hand. A second, all-AI table plays alongside it in the background, resolving each hand instantly (nobody's watching it live) using the exact same engine and AI logic as your table. After every hand, if the two tables' player counts differ by 2 or more, one AI player gets moved to rebalance them — you'll see a notice if someone joins or leaves your table. Once the combined field shrinks to one table's worth of players, everyone merges onto a single final table (yours) and play continues as a normal single-table tournament from there. Scoped to exactly two tables for now, specifically so the balancing and merge logic could be tested exhaustively rather than left open-ended.</p>
      </details>
      <details class="man-sec">
        <summary>Career Mode — how it works</summary>
        <p class="muted">Four tiers: Local League (6-Max) &rarr; Regional Circuit (Full Ring) &rarr; National Championship (Full Ring, Hard AI) &rarr; The Majors (Full Ring Multi-Table, Hard AI). Every event is a completely normal tournament — the tier just auto-selects the format, table size, difficulty, and buy-in; nothing about how a tournament plays is different from entering one manually. Placements earn ranking points (100 for 1st, scaling down to 5 for a min finish); reach a tier's point threshold and you're promoted. Winning an event at the top tier makes you a champion. This is entirely separate from the Tournament tab, which stays available the whole time as a practice toggle — jump into any format directly regardless of career progress.</p>
      </details>
      <details class="man-sec">
        <summary>Known Limitations (v0.35.0)</summary>
        <ul class="muted" style="line-height:1.7;">
          <li>Sponsorships aren't built yet — the Marker Called screen has an architectural slot reserved for "burn a sponsorship" once that system exists.</li>
          <li>Career Mode's entry cost and marker size scale only by tier, not by betting structure.</li>
          <li>Preflop Position's Short-Deck chart covers opening ranges only — Facing A Raise isn't available for Short-Deck yet. Range Reading isn't deck-aware at all.</li>
          <li>Limit Hold'em's raise cap (4 bets/street) is a fixed constant. Hard-mode AI's Big Blind defense uses a fixed defend-width per format.</li>

n and a render smoke-test across every tab came back clean.</div>

          <div style="margin-top:8px;"><b>v0.17.0</b> — Hard-mode AI now plays a real Big Blind, closing the last gap in its decision-making (it used to fall back to the simple standard-mode heuristic there). When nobody's raised, it recognizes the free option — only raising real value hands, checking everything else rather than folding or raising randomly. When facing a real raise, it defends a fixed, format-appropriate width (55% heads-up, 42% 6-Max, 36% 9-Max, reflecting BB's superior pot odds and positional closing advantage) using the same <code>classifyFacingRaise()</code> already tested for every other seat. Tested: confirmed BB decisions are never null anymore across all three supported formats, verified the full decision matrix directly (AA always raises the free option and never folds facing a raise; 72o always checks the free option and always folds facing a raise), and reran the engine regression — 900 hard-mode hands with per-action chip-invariant checking plus the full 36,000-hand standard-mode sweep, both clean.</div>
          <div style="margin-top:8px;"><b>v0.16.0</b> — Added procedural background music: two chord-loop themes ("Lounge" for normal play, "High Stakes" for tournament moments when short-stacked or at a final table), synthesized live with the same zero-external-file approach as the sound effects, using a standard lookahead scheduler for accurate timing. New Options controls: a Music on/off toggle and its own volume slider, independent of the sound-effects volume. The theme switches automatically based on game state (checked cheaply each render, with an early-exit guard so redundant switches cost nothing) rather than needing a manual toggle. Tested: confirmed the whole music system safely no-ops under Node (no AudioContext available, same guard pattern as the SFX layer) so it couldn't affect the test suite, and verified <code>desiredMusicTheme()</code> picks correctly across cash games, full-field tournaments, short-stacked situations, and a near-final-table scenario. Full 36,000-hand regression came back clean.</div>
          <div style="margin-top:8px;"><b>v0.15.0</b> — Closed out the two mechanical-honesty items from Known Limitations. (1) <b>Bluff 3-bets</b>: Facing A Raise now includes a small fixed set of hands (suited wheel aces A2s-A5s, suited connectors 65s-98s) that 3-bet as bluffs even though they're too weak to continue for value, shown in a distinct purple on the range grid versus red for value 3-bets, with the drill explanation calling out which kind is correct and why. (2) <b>True left-of-button remainder handling</b>: split pots and uncontested-layer refunds now award any odd chip to whoever is genuinely closest to the left of the dealer button among the recipients, computed from actual seating order — not just the first entry in an arbitrary array, which was the prior simplification. Tested: verified all bluff labels are valid hand types, AA/72o still always classify correctly and are never affected by the bluff list, the classification remains a clean partition (every hand gets exactly one of 3bet/call/fold) across every seat/opener/format combination, <code>seatOrderFromButton()</code> produces a valid seating permutation starting immediately left of the button, and a forced 3-way-contribution/2-way-tie scenario confirmed the remainder chip goes to the correct player by actual button position rather than array index. Full regression (36,000+ hands) across cash games and both tournament difficulties came back clean, since <code>goToShowdown</code> is shared code touched by this change.</div>
          <div style="margin-top:8px;"><b>v0.14.0</b> — Added keyboard shortcuts to Play mode's action buttons, matching the Blackjack trainer's convention: a number-row primary key plus a letter-key alternate for muscle memory (1/Z Fold, 2/X Check-Call, 3/C Half-Pot, 4/V Pot, 5/B All-In), plus Enter/Space to deal or advance to the next hand. Shortcuts are printed directly on the buttons. Refactored the five action handlers into shared functions used by both the click handlers and the keyboard handler, specifically so the two input paths can never compute a different bet amount for the same action. Tested: all 10 key mappings verified to dispatch to the correct action via direct monkey-patching (isolating the mapping itself from downstream game-state cascades), confirmed shortcuts are ignored both when it isn't the human's turn and when the Play tab isn't active, and reran the 36,000-hand chip-conservation regression to confirm the refactor didn't change any behavior.</div>
          <div style="margin-top:8px;"><b>v0.13.0</b> — First "bring the Blackjack trainer's polish over" pass: a real win/loss result banner at showdown ("YOU WIN $250 (Flush)" / "YOU LOSE $180 (beaten by Two Pair)") instead of just a log line, an animated stack count-up/count-down when chips change hands, a proper cash-game "Game Over" screen (rebuy or return to setup) instead of silently sitting out forever, and a themed hover-tooltip system applied to the previously-unexplained numbers across Pot Odds &amp; Equity, Bet Sizing &amp; Bluffing, Range Reading, Preflop Position, and Stats. Caught and fixed a real bug while testing the banner: the first version compared stacks at the payout instant rather than across the whole hand, which made a genuine loss look identical to a push (both showed $0 change) — fixed by snapshotting stacks at the true start of the hand, verified across 200 sampled hands correctly showing all three outcomes. The animation system is hard-guarded to safely no-op outside a browser, same pattern as the audio layer, so it couldn't affect the test suite. Full 36,000-hand regression came back clean.</div>
          <div style="margin-top:8px;"><b>v0.12.0</b> — Added Career Mode: a four-tier ladder (Local League &rarr; Regional Circuit &rarr; National Championship &rarr; The Majors) with ranking points, promotion, a career bankroll, and championship tracking at the top tier. Every career event is a completely ordinary tournament under the hood (single-table or, at the top tier, multi-table) — the tier just auto-selects the settings and buy-in multiplier, so this inherits all the correctness work already done rather than introducing a new tournament code path. The Tournament tab is untouched and still serves as a practice toggle for any format regardless of career progress, exactly as asked for. Tested: table size/difficulty/buy-in scaling verified against tier config at event start, a 40-event full-career simulation confirming tier promotion, point accumulation, and bankroll tracking, a dedicated test of the Majors (multi-table) career path since it's a distinct code branch from single-table events, and championship detection confirmed on a top-tier win. Also reran the cash-game regression to confirm shared code was undisturbed.</div>
          <div style="margin-top:8px;"><b>v0.11.0</b> — Added Multi-Table Tournaments (Phase 2): a second all-AI table plays in the background using the same engine, table balancing moves players between the two tables as the field shrinks, and everyone consolidates onto a final table once the combined field fits on one. Built on a small, safe engine addition — background (all-AI) tables now resolve each hand instantly instead of with the human-paced delay, reusing the exact same <code>applyAction</code>/<code>aiDecision</code>/<code>proceedTurn</code> chain as normal play. Tested: full multi-table tournaments simulated to completion across both table sizes and both AI difficulties, with exact chip conservation across <i>both</i> tables (and through merges) the entire way, globally-unique player IDs maintained throughout, complete non-duplicated elimination/placement accounting covering every place in the field exactly once, and confirmation that exactly one table survives at completion. Also reran the cash-game and single-table-tournament regressions (36,000+ hands) to confirm the shared code paths were undisturbed.</div>
          <div style="margin-top:8px;"><b>v0.10.0</b> — Added Tournament Mode (Phase 1: single-table engine). Real blind-level schedule (15 levels, escalating every 8 hands), genuine no-rebuy eliminations with tracked finishing order, a payout structure by field size, and a completion screen with final standings and prizes. If you bust before the tournament ends, the remaining field keeps playing automatically (same real pacing as normal play) so you can watch it resolve. Built almost entirely on the existing cash-game engine — the shrinking-field table visualization needed zero changes, since busted players already got excluded from dealing via the existing sit-out mechanism. Tested: full tournaments simulated to completion across both field sizes and both AI difficulties with exact chip conservation throughout, complete and non-duplicated finishing-order/placement accounting, payout totals matching the declared structure, and the human-elimination auto-continue mechanism verified with both a synchronous test stub and genuine real-world <code>setTimeout</code> scheduling. Also reran the full cash-game regression (48,000 hands) to confirm the shared code paths (<code>finishHand</code>, <code>initTable</code>) didn't disturb normal play.</div>
          <div style="margin-top:8px;"><b>v0.9.0</b> — Visual polish pass across Play mode: richer felt (layered gradients, wood-grain rail, inner vignette), upgraded card rendering (deeper shadow, subtle deal-in animation), a pulsing glow on whoever's turn it is, a glossy dealer button, and small decorative chip-stack icons next to bet and pot amounts (color-coded by rough size tier). Buttons and tabs got smoother hover/active transitions throughout. Purely presentational — verified with a full render smoke-test across every Play-mode stage (setup, mid-hand, showdown) and every other tab, plus a 36,000-hand regression confirming the engine itself is completely unchanged.</div>
          <div style="margin-top:8px;"><b>v0.8.0</b> — Added Hard-Mode AI as a Play-mode option, built entirely on top of already-tested subsystems rather than new heuristics: real Chen-ranked position ranges preflop (via a dealer-rotation-to-seat mapping), opener-aware 3-bet math from Facing A Raise, and live Monte Carlo equity vs. real pot odds postflop. Also optimized <code>estimateEquity()</code> (build the reduced deck once per call instead of once per trial) for ~2.5x speedup, needed to keep hard-mode AI responsive in live play. Tested: seat-position mapping verified against known dealer rotations in both 6-Max and Heads-Up, AA always opens/continues and 72o always folds in scripted scenarios, and a 960-hand regression with per-action chip-invariant checking across every table size and both difficulties came back clean. Re-ran the full 96,000-hand standard-mode regression too, since the equity function is shared code — also clean.</div>
          <div style="margin-top:8px;"><b>v0.7.1</b> — Refined Facing A Raise: the value 3-bet zone now scales with the <i>opener's</i> range width instead of a flat constant — a raise from a tight early seat (stronger average holding) gets a narrower 3-bet zone than a raise from a wide late seat (easier to isolate), via <code>threeBetPct = clamp(openerPct &times; 0.2, 3%, 12%)</code>, always capped at the responder's own continuing range so the 3-bet zone can never exceed it. The explorer now lets you pick which seat the raise came from, and the drill only ever generates realistic match-ups (opener strictly earlier than responder). Tested: the zone never exceeds the responder's range or the 12% cap, it widens monotonically as the opener's range widens, and 500-sample checks in both 6-Max and 9-Max confirm the drill never generates an impossible opener/responder pairing. Full 60,000-hand regression confirms the core engine is untouched.</div>
          <div style="margin-top:8px;"><b>v0.7.0</b> — Added atmosphere: a fully synthesized audio layer (Web Audio API, zero external files) with sounds for dealing, betting/calling/raising, folding, winning a pot, and correct/wrong drill answers, plus a new Options tab (master mute, volume slider, Sound Test panel) and a quick-access mute button in the header. The audio functions are hard-guarded to no-op safely whenever <code>window</code>/AudioContext isn't available, so they could be called directly inside engine logic (dealing, betting, showdown) without risk to the test suite — verified by rerunning the full 120,000-hand chip-conservation regression with those hooks active throughout.</div>
          <div style="margin-top:8px;"><b>v0.6.0</b> — Fleshed out three mechanics flagged as known limitations, before touching audio/atmosphere: (1) <b>Facing A Raise</b> in Preflop Position — a new 3-Bet/Call/Fold chart and drill using a constant top-5% value-3-bet zone plus each seat's own opening frequency as its continuing range; (2) <b>board-card blockers</b> in Range Reading — the explorer and drill now deal a flop/turn/river and count combos against hole cards <i>and</i> the board together, since comboCount() already treated all dead cards uniformly; (3) <b>semi-bluff equity</b> in Bet Sizing &amp; Bluffing — generalized the bluff-frequency formula to bluffs that keep some equity when called (e.g. a flush draw), verified to reduce exactly to the original pure-bluff formula at 0% equity and to always require a <i>higher</i> bluff frequency as that equity rises (semi-bluffs are cheaper for an opponent to call, so more are needed to stay balanced). All three verified with dedicated test suites (partition/monotonicity/reference-value checks) plus a 120,000-hand full regression confirming the core engine is untouched.</div>
          <div style="margin-top:8px;"><b>v0.5.0</b> — Added the Stats tab: aggregate accuracy across all five drills, plus a Play-mode session panel (hands played, win rate, net chips, showdown win rate, biggest pot won). Play-mode win/showdown tracking is computed directly inside the same showdown-resolution code already covered by the chip-conservation regression suite, so it shares that correctness guarantee rather than being a separate bolt-on counter.</div>
          <div style="margin-top:8px;"><b>v0.4.0</b> — Added the Bet Sizing &amp; Bluffing tab (balanced bluff frequency / bluff-to-value ratio calculator, reference table across standard bet sizes, and a Combo Balance drill) — all five original skill areas are now fully built out. Also added a Study Glossary view to the Terminology tab (all terms in one alphabetized, readable list) since the quiz-only version gave no way to learn terms before being tested on them; Terminology now opens in glossary view by default. Tested: bluff-frequency/ratio formulas against known reference values (100%-pot bet = 33.3% freq / 2:1 ratio, 50%-pot bet = 25% freq / 3:1 ratio), and confirmed the formula's dependence on bet-to-pot ratio only (not absolute pot size).</div>
          <div style="margin-top:8px;"><b>v0.3.1</b> — Bug fix: found (via 24,000-hand regression testing) a rare side-pot edge case where a short-stacked blind posting less than the configured blind size could create a pot layer with zero eligible winners, silently deleting that money from the table. Fixed at the root (currentBet now reflects the actual posted blind amount, not the configured one) and added a safety-net refund in the pot-building logic so an uncontested layer always returns to whoever contributed it instead of vanishing. Verified with 360,000 simulated hands using per-action invariant checking (catching a chip discrepancy the instant it would occur, not just at hand-end) across all three table formats — zero failures.</div>
          <div style="margin-top:8px;"><b>v0.3.0</b> — Added the Range Reading tab: an explorer showing a seat's opening range with live combo counts as your hole cards block specific combinations, plus a Combo Counting drill. Reuses the Chen-ranked hand types from Preflop Position. Tested: comboCount() reproduces each hand type's base combo count (6/4/12) with no blockers, correctly drops to 3 for a pocket pair when holding one of that rank, and the "6-Max opens" combo totals sum correctly across all in-range hand types.</div>
          <div style="margin-top:8px;"><b>v0.2.0</b> — Added the Preflop Position tab: opening-range charts for Heads-Up / 6-Max / 9-Max built from the Chen Formula, plus a Raise/Fold drill against those charts. Tested: Chen-score reference values (AA=20, AKs=12, AKo=10, 72o=&minus;1), monotonic range nesting (wider seats are always supersets of tighter seats), and full 1,326-combo accounting.</div>
          <div style="margin-top:8px;"><b>v0.1.0-skeleton</b> — Initial skeleton. All tabs present. Play mode fully functional (configurable Heads-Up/6-Max/9-Max, full betting engine with side pots, 4 AI personalities). Terminology and Pot Odds &amp; Equity drills fully functional. Theme ported from the Blackjack Counting Trainer (palette, fonts, card-fan logo). Caught and fixed a real bug during testing where a busted player's stale chip contribution from a prior hand leaked into the next hand's side-pot math; verified the fix with 36,000 simulated hands through the production code path across all three table formats with zero chip-conservation errors.</div>
        </div>
      </details>
    </div>`;
}

/* =========================================================
   OPTIONS — audio settings
   ========================================================= */
function renderOptions(){
  const a = state.audio;
  const m = a.music;
  return `
    <div class="card-box">
      <h2>Options</h2>
      <div class="muted">All sound is synthesized live via the Web Audio API &mdash; there are no external audio files. Sounds play in response to real actions (dealing, betting, folding, winning, drill answers) throughout the trainer.</div>
      <div class="btn-row" style="margin-top:16px;">
        <button class="btn${a.muted?' danger':' primary'}" id="toggleMute">${a.muted?'Unmute':'Mute All Sound'}</button>
      </div>
      <label class="field" style="margin-top:16px; max-width:320px;">
        Sound Effects Volume
        <input type="range" id="volumeSlider" min="0" max="100" value="${Math.round(a.volume*100)}">
      </label>

      <h3 style="margin-top:20px; color:var(--gold-bright);">Background Music</h3>
      <div class="muted">Procedurally generated chord loops, same zero-file approach as the sound effects. Four themes: "Lounge" for normal play, "High Stakes" when short-stacked or at a final table, "Career" on your Career home screen, and "Triumphant" when you win a tournament.</div>
      <div class="btn-row" style="margin-top:10px;">
        <button class="btn${m.enabled?' primary':''}" id="toggleMusic">${m.enabled?'Music: On':'Music: Off'}</button>
      </div>
      <label class="field" style="margin-top:12px; max-width:320px;">
        Music Volume
        <input type="range" id="musicVolumeSlider" min="0" max="100" value="${Math.round(m.volume*100)}">
      </label>

      <h3 style="margin-top:20px; color:var(--gold-bright);">Table Appearance</h3>
      <div class="muted">Purely cosmetic — changes felt color and card-back design, nothing about how the game plays.</div>
      <div style="display:flex; gap:16px; flex-wrap:wrap; margin-top:10px;">
        <label class="field">Felt Color
          <select id="cfgFeltTheme">
            ${FELT_THEMES.map(f=>`<option value="${f.id}" ${FELT_THEME===f.id?'selected':''}>${f.name}</option>`).join('')}
          </select>
        </label>
        <label class="field">Card Back
          <select id="cfgDeckTheme">
            ${DECK_THEMES.map(d=>`<option value="${d.id}" ${DECK_THEME===d.id?'selected':''}>${d.name}</option>`).join('')}
          </select>
        </label>
      </div>

      <h3 style="margin-top:20px; color:var(--gold-bright);">Saved Progress</h3>
      <div class="muted">Career progress, drill scores, and these audio settings are saved automatically to this browser as you play — closing the tab and coming back later picks up right where you left off. If your browser blocks storage (e.g. private/incognito mode), the trainer still works fine, it just won't remember anything next time.</div>
      <div class="muted" style="margin-top:6px; font-family:'JetBrains Mono',monospace; font-size:0.72rem;" id="saveState"></div>
      <div class="btn-row" style="margin-top:10px;">
        <button class="btn danger" id="btnResetProgress">Reset All Progress</button>
      </div>

      <h3 style="margin-top:20px; color:var(--gold-bright);">Sound Test</h3>
      <div class="muted">Preview each sound even with the tab you'd normally hear it in closed.</div>
      <div class="btn-row" style="margin-top:10px;">
        <button class="btn" id="testDeal">Deal</button>
        <button class="btn" id="testChip">Chip / Bet</button>
        <button class="btn" id="testFold">Fold</button>
        <button class="btn" id="testWin">Win</button>
        <button class="btn" id="testCorrect">Drill: Correct</button>
        <button class="btn" id="testWrong">Drill: Wrong</button>
      </div>
    </div>`;
}
function wireOptionsEvents(){
  const resetBtn = document.getElementById('btnResetProgress');
  if(resetBtn) resetBtn.addEventListener('click', ()=>{
    if(typeof confirm==='function' && !confirm('Erase all saved career progress and drill scores? This cannot be undone.')) return;
    resetAllProgress();
    render();
  });
  const muteBtn = document.getElementById('toggleMute');
  if(muteBtn) muteBtn.addEventListener('click', ()=>{
    state.audio.muted = !state.audio.muted;
    if(!state.audio.muted) getAudioCtx(); // resume/create on unmute (satisfies the user-gesture requirement)
    render();
  });
  const slider = document.getElementById('volumeSlider');
  if(slider) slider.addEventListener('input', ()=>{ state.audio.volume = parseInt(slider.value,10)/100; });
  const musicBtn = document.getElementById('toggleMusic');
  if(musicBtn) musicBtn.addEventListener('click', ()=>{
    state.audio.music.enabled = !state.audio.music.enabled;
    if(state.audio.music.enabled) startMusic(); else stopMusic();
    render();
  });
  const musicSlider = document.getElementById('musicVolumeSlider');
  if(musicSlider) musicSlider.addEventListener('input', ()=>{ state.audio.music.volume = parseInt(musicSlider.value,10)/100; });
  const feltSel = document.getElementById('cfgFeltTheme');
  if(feltSel) feltSel.addEventListener('change', ()=>{ FELT_THEME = feltSel.value; applyThemes(); render(); });
  const deckSel = document.getElementById('cfgDeckTheme');
  if(deckSel) deckSel.addEventListener('change', ()=>{ DECK_THEME = deckSel.value; applyThemes(); render(); });
  const bind = (id, fn)=>{ const el=document.getElementById(id); if(el) el.addEventListener('click', fn); };
  bind('testDeal', sfxDeal);
  bind('testChip', sfxChip);
  bind('testFold', sfxFold);
  bind('testWin', sfxWin);
  bind('testCorrect', sfxCorrect);
  bind('testWrong', sfxWrong);
}

/* =========================================================
   MAIN RENDER DISPATCH
   ========================================================= */
function renderMain(){
  const el = document.getElementById('mainArea');
  let html = '';
  if(state.activeTab==='play') html = renderPlay();
  else if(state.activeTab==='terms') html = renderTerms();
  else if(state.activeTab==='potodds') html = renderPotOdds();
  else if(state.activeTab==='ranges') html = renderRanges();
  else if(state.activeTab==='bluff') html = renderBluff();
  else if(state.activeTab==='stats') html = renderStats();
  else if(state.activeTab==='preflop') html = renderPreflop();
  else if(state.activeTab==='variants') html = renderVariants();
  else if(state.activeTab==='image') html = renderImage();
  else if(state.activeTab==='test') html = renderSkillsTest();
  else if(state.activeTab==='manual') html = renderManual();
  else if(state.activeTab==='options') html = renderOptions();
  el.innerHTML = html;

  if(state.activeTab==='play') wirePlayEvents();
  else if(state.activeTab==='terms') wireTermsEvents();
  else if(state.activeTab==='potodds') wirePotOddsEvents();
  else if(state.activeTab==='preflop') wirePreflopEvents();
  else if(state.activeTab==='ranges') wireRangesEvents();
  else if(state.activeTab==='bluff') wireBluffEvents();
  else if(state.activeTab==='stats') wireStatsEvents();
  else if(state.activeTab==='variants') wireVariantsEvents();
  else if(state.activeTab==='image') wireImageEvents();
  else if(state.activeTab==='test') wireSkillsTestEvents();
  else if(state.activeTab==='options') wireOptionsEvents();
}

function render(){
  document.getElementById('versionTag').textContent = APP_VERSION;
  const muteBtn = document.getElementById('hdrMuteBtn');
  if(muteBtn){
    muteBtn.textContent = state.audio.muted ? '🔇' : '🔊';
    if(!muteBtn._wired){
      muteBtn.addEventListener('click', ()=>{
        state.audio.muted = !state.audio.muted;
        if(!state.audio.muted) getAudioCtx();
        render();
      });
      muteBtn._wired = true;
    }
  }
  checkAchievements();
  renderMain();
  saveProgress();
}

/* ---------------- INIT ---------------- */
loadProgress();
renderTabBar();
render();
if(typeof document !== 'undefined' && document.addEventListener){
  document.addEventListener('keydown', handlePlayKeydown);
  document.addEventListener('keydown', handleGlobalKeydown);
}
</script>
