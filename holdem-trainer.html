    tournament: null,
    dealerName: DEALER_NAMES[Math.floor(Math.random()*DEALER_NAMES.length)],
    nextDealerShiftHand: DEALER_SHIFT_INTERVAL_MIN + Math.floor(Math.random()*(DEALER_SHIFT_INTERVAL_MAX-DEALER_SHIFT_INTERVAL_MIN))
  };
}

function tlog(t, msg){ t.log.unshift(msg); if(t.log.length>60) t.log.pop(); }

function activePlayers(t){ return t.players.filter(p=>!p.sitOut); }
function inHandPlayers(t){ return t.players.filter(p=>!p.folded && !p.sitOut); }

function nextIdx(t, from){
  const list = activePlayers(t);
  const n = list.length;
  let i = list.findIndex(p=>p.id===from);
  for(let k=1;k<=n;k++){
    const cand = list[(i+k)%n];
    if(!cand.folded && !cand.allIn) return cand.id;
  }
  return -1;
}

function startHand(t){
  const players = activePlayers(t).filter(p=>p.stack>0);
  if(players.length<2){ tlog(t,'Not enough players with chips. Reset the table.'); render(); return; }
  t.lastHandResult = null;
  // Table Image tracking: reset the per-hand VPIP/PFR flags and count this hand as observed
  // (once per hand dealt to the human, whether or not they end up with a real decision point).
  if(!t.humanImage) t.humanImage = newHumanImage();
  t.humanImage.vpipCountedThisHand = false;
  t.humanImage.pfrCountedThisHand = false;
  const humanForImage = t.players.find(p=>p.isHuman);
  if(humanForImage && !humanForImage.sitOut) t.humanImage.handsObserved++;
  // Snapshot every stack BEFORE any money moves this hand, so the win/loss banner can reflect
  // true whole-hand profit/loss (money in vs. money back), not just the payout-instant delta —
  // a genuine loss (contributed chips, won nothing back) has a payout-instant delta of exactly 0,
  // which would otherwise misclassify as a "push."
  t.handStartStacks = {};
  t.players.forEach(p=>{ t.handStartStacks[p.id] = p.stack; });
  players.forEach(p=>{ p.sitOut=false; });
  t.players.forEach(p=>{ if(p.stack<=0) p.sitOut=true; });

  // Reset EVERY player's per-hand fields (not just active ones) so a busted/sitting-out
  // player's stale totalContributed from a previous hand can never leak into this hand's
  // side-pot math (this was a real bug caught during testing — see Manual > Version History).
  t.players.forEach(p=>{
    p.currentBet = 0;
    p.totalContributed = 0;
    p.allIn = false;
    p.acted = false;
    p.holeCards = [];
    p.handEval = null;
    p.folded = p.sitOut; // sitting-out players are always excluded, active players start unfolded
  });

  t.deck = shuffle(t.cfg.bettingStructure==='shortdeck' ? buildShortDeck() : buildDeck());
  t.board = [];
  t.pot = 0;
  t.handNum++;

  // Dealer shift changes and light table chatter — purely atmospheric, no effect on play.
  if(t.handNum >= t.nextDealerShiftHand){
    const others = DEALER_NAMES.filter(n=>n!==t.dealerName);
    const newDealer = others[Math.floor(Math.random()*others.length)];
    tlog(t, `Dealer ${t.dealerName} is relieved by ${newDealer}.`);
    t.dealerName = newDealer;
    t.nextDealerShiftHand = t.handNum + DEALER_SHIFT_INTERVAL_MIN + Math.floor(Math.random()*(DEALER_SHIFT_INTERVAL_MAX-DEALER_SHIFT_INTERVAL_MIN));
  } else if(Math.random() < 0.08){
    tlog(t, DEALER_HELLOS[Math.floor(Math.random()*DEALER_HELLOS.length)]);
  }

  const list = activePlayers(t);
  t.dealerIdx = (t.dealerIdx+1) % list.length;
  list.forEach(p=>{ p.holeCards=[deal(t)]; });
  list.forEach(p=>{ p.holeCards.push(deal(t)); });
  sfxDeal();

  const dealerPlayer = list[t.dealerIdx];
  let sbId, bbId;
  if(list.length===2){
    sbId = dealerPlayer.id;
    bbId = list[(t.dealerIdx+1)%list.length].id;
  } else {
    sbId = list[(t.dealerIdx+1)%list.length].id;
    bbId = list[(t.dealerIdx+2)%list.length].id;
  }
  postBlind(t, sbId, t.cfg.smallBlind);
  postBlind(t, bbId, t.cfg.bigBlind);
  // Use the ACTUAL posted amounts (a short-stacked blind gets clamped to their stack in postBlind),
  // not the configured blind size, so currentBet never overstates what's really been wagered.
  const sbPlayer = t.players.find(p=>p.id===sbId);
  const bbPlayer = t.players.find(p=>p.id===bbId);
  t.currentBet = Math.max(sbPlayer.currentBet, bbPlayer.currentBet);
  t.minRaise = t.cfg.bigBlind;
  t.betsThisStreet = 0; // Limit Hold'em's per-street raise cap; blinds don't count toward it
  t.stage='preflop';
  t.lastAggressorId = null;
  t.actingIdx = list.length===2 ? sbId : nextIdx(t, bbId);
  tlog(t, `— Hand #${t.handNum} — blinds posted (SB $${t.cfg.smallBlind} / BB $${t.cfg.bigBlind})`);
  clearActedFlags(t);
  render();
  maybeRunAI(t);
}

function deal(t){ return t.deck.pop(); }

function postBlind(t, id, amount){
  const p = t.players.find(x=>x.id===id);
  const amt = Math.min(amount, p.stack);
  p.stack -= amt; p.currentBet += amt; p.totalContributed += amt; t.pot += amt;
  if(p.stack===0) p.allIn=true;
  tlog(t, `${p.name} posts $${amt}`);
}

function clearActedFlags(t){ t.players.forEach(p=>p.acted=false); }

function bettingRoundDone(t){
  const ihp = inHandPlayers(t).filter(p=>!p.allIn);
  if(ihp.length===0) return true;
  return ihp.every(p=> p.acted && p.currentBet===t.currentBet);
}

function onlyOneLeft(t){ return inHandPlayers(t).length<=1; }

/* Pot-Limit max raise: standard rule is "pot after you call" — i.e. current pot + the amount
   you must first put in to call, doubled (once for your call, once for the raise itself
   being capped at that same size). Reduces correctly to "max opening bet = size of the pot"
   when toCall is 0 (no bet facing you yet). */
function maxPotRaiseTotal(t, player){
  const toCall = t.currentBet - player.currentBet;
  const maxIncrement = t.pot + toCall;
  return t.currentBet + maxIncrement; // the max TOTAL bet (player.currentBet after acting) allowed
}

function limitBetSize(t){
  return (t.stage==='preflop' || t.stage==='flop') ? t.cfg.bigBlind : t.cfg.bigBlind*2;
}

function applyAction(t, playerId, action){
  const p = t.players.find(x=>x.id===playerId);
  if(!p || p.folded || p.allIn) return;
  const toCall = t.currentBet - p.currentBet;
  trackHumanImage(t, p, action.type);

  if(action.type==='fold'){
    p.folded = true; p.acted = true;
    sfxFold();
    tlog(t, `${p.name} folds`);
  } else if(action.type==='check'){
    if(toCall>0) return applyAction(t,playerId,{type:'call'});
    p.acted = true;
    tlog(t, `${p.name} checks`);
  } else if(action.type==='call'){
    const amt = Math.min(toCall, p.stack);
    p.stack -= amt; p.currentBet += amt; p.totalContributed += amt; t.pot += amt;
    if(p.stack===0) p.allIn = true;
    p.acted = true;
    sfxChip();
    tlog(t, amt<toCall ? `${p.name} calls $${amt} (all-in)` : `${p.name} calls $${amt}`);
  } else if(action.type==='bet' || action.type==='raise'){
    if(t.cfg.bettingStructure==='limit' && (t.betsThisStreet||0) >= 4){
      // Cap already reached this street — no more bets/raises are legal, silently call instead.
      return applyAction(t, playerId, {type:'call'});
    }
    let target;
    if(t.cfg.bettingStructure==='limit'){
      target = t.currentBet + limitBetSize(t); // the requested amount is irrelevant — size is fixed
    } else {
      target = action.amount;
      target = Math.max(target, t.currentBet + t.minRaise);
      if(t.cfg.bettingStructure==='potlimit'){
        target = Math.min(target, maxPotRaiseTotal(t, p));
      }
    }
    let amt = target - p.currentBet;
    amt = Math.min(amt, p.stack);
    const raiseSize = (p.currentBet+amt) - t.currentBet;
    p.stack -= amt; p.currentBet += amt; p.totalContributed += amt; t.pot += amt;
    if(p.stack===0) p.allIn = true;
    if(raiseSize>0) t.minRaise = Math.max(t.minRaise, raiseSize);
    t.currentBet = Math.max(t.currentBet, p.currentBet);
    if(t.cfg.bettingStructure==='limit') t.betsThisStreet = (t.betsThisStreet||0) + 1;
    t.players.forEach(x=>{ if(x.id!==p.id && !x.folded && !x.allIn) x.acted=false; });
    p.acted = true;
    t.lastAggressorId = p.id;
    sfxChip();
    tlog(t, `${p.name} ${action.type==='bet'?'bets':'raises to'} $${p.currentBet}${p.allIn?' (all-in)':''}`);
  }
}

function advanceStreet(t){
  t.players.forEach(p=>{ p.currentBet=0; p.acted=false; });
  t.currentBet = 0; t.minRaise = t.cfg.bigBlind;
  t.betsThisStreet = 0;
  if(t.stage==='preflop'){ t.board.push(deal(t),deal(t),deal(t)); t.stage='flop'; }
  else if(t.stage==='flop'){ t.board.push(deal(t)); t.stage='turn'; }
  else if(t.stage==='turn'){ t.board.push(deal(t)); t.stage='river'; }
  else if(t.stage==='river'){ return goToShowdown(t); }
  tlog(t, `— ${t.stage.toUpperCase()} — ${t.board.map(c=>rankLabel(c.r)+SUIT_SYM[c.s]).join(' ')}`);
  sfxDeal();
  const list = activePlayers(t);
  t.actingIdx = list[(t.dealerIdx+1)%list.length].id;
  while(true){
    const ap = t.players.find(x=>x.id===t.actingIdx);
    if(!ap || ap.folded || ap.allIn){ t.actingIdx = nextIdx(t, t.actingIdx); if(t.actingIdx===-1) break; } else break;
  }
  if(t.actingIdx===-1 || inHandPlayers(t).filter(p=>!p.allIn).length===0){
    return advanceStreet(t); // everyone all-in, run it out
  }
}

function buildPots(t){
  const contributors = t.players.filter(p=>p.totalContributed>0 && !p.sitOut);
  const levels = [...new Set(contributors.map(p=>p.totalContributed))].sort((a,b)=>a-b);
  const pots = []; let prev=0;
  for(const level of levels){
    const layerPlayers = contributors.filter(p=>p.totalContributed>=level);
    const layerAmount = (level-prev)*layerPlayers.length;
    if(layerAmount>0){
      const eligible = layerPlayers.filter(p=>!p.folded).map(p=>p.id);
      // Track every contributor to this layer (including folded players) so that if NO
      // eligible (non-folded) player exists for this layer — which can happen when a
      // short-stacked blind gets clamped below what a folded player posted — the money
      // can be refunded to whoever actually put it in, instead of silently vanishing.
      const layerContributors = layerPlayers.map(p=>p.id);
      pots.push({amount:layerAmount, eligible, layerContributors});
    }
    prev = level;
  }
  return pots;
}

/* Real poker rule: an odd chip that can't split evenly goes to whoever is closest to the
   left of the dealer button among the recipients, not just "first in some arbitrary list." */
function seatOrderFromButton(t){
  const list = activePlayers(t);
  const n = list.length;
  if(n===0) return [];
  const order = [];
  for(let k=1;k<=n;k++) order.push(list[(t.dealerIdx+k)%n].id);
  return order; // ids in clockwise order starting immediately left of the button
}
function sortPlayersByButtonOrder(t, players){
  const order = seatOrderFromButton(t);
  return players.slice().sort((a,b)=> order.indexOf(a.id) - order.indexOf(b.id));
}

function goToShowdown(t){
  t.stage='showdown';
  const stacksBefore = {};
  t.players.forEach(p=>{ stacksBefore[p.id] = p.stack; });
  const remaining = inHandPlayers(t);
  if(remaining.length===1){
    const w = remaining[0];
    w.stack += t.pot;
    tlog(t, `${w.name} wins $${t.pot} (everyone else folded)`);
    if(w.id===0){
      t.stats.humanHandsWon++;
      t.stats.biggestPotWon = Math.max(t.stats.biggestPotWon, t.pot);
      sfxWin();
    }
    t.pot = 0;
    finalizeHandVisuals(t, stacksBefore);
    finishHand(t);
    return;
  }
  while(t.board.length<5) t.board.push(deal(t));
  const pots = buildPots(t);
  const shortDeck = t.cfg.bettingStructure==='shortdeck';
  remaining.forEach(p=>{ p.handEval = bestOf(p.holeCards.concat(t.board), shortDeck); });
  const humanInShowdown = remaining.some(p=>p.id===0);
  if(humanInShowdown) t.stats.humanShowdownsSeen++;
  let humanWonThisHand = false;
  pots.forEach(pot=>{
    const contenders = remaining.filter(p=>pot.eligible.includes(p.id));
    if(contenders.length===0){
      // No non-folded player contributed at this level (e.g. a short-stacked blind was
      // clamped below what a folded player posted). Nobody can win this money since no
      // one still in the hand matched it — refund it to whoever actually contributed it
      // rather than letting it vanish from the total chip count.
      const refundEach = Math.floor(pot.amount / pot.layerContributors.length);
      let remainder = pot.amount - refundEach*pot.layerContributors.length;
      const contribPlayers = sortPlayersByButtonOrder(t, pot.layerContributors.map(id=>t.players.find(x=>x.id===id)));
      contribPlayers.forEach((pl,i)=>{
        pl.stack += refundEach + (i===0?remainder:0);
      });
      tlog(t, `$${pot.amount} returned (uncontested by anyone still in the hand)`);
      return;
    }
    let best = contenders[0].handEval;
    contenders.forEach(p=>{ if(compareEval(p.handEval,best,shortDeck)>0) best=p.handEval; });
    const winnersRaw = contenders.filter(p=>compareEval(p.handEval,best,shortDeck)===0);
    const winners = sortPlayersByButtonOrder(t, winnersRaw);
    const share = Math.floor(pot.amount/winners.length);
    let remainder = pot.amount - share*winners.length;
    winners.forEach((w,i)=>{ w.stack += share + (i===0?remainder:0); });
    if(winners.some(w=>w.id===0)){
      humanWonThisHand = true;
      t.stats.biggestPotWon = Math.max(t.stats.biggestPotWon, pot.amount);
    }
    tlog(t, `Pot of $${pot.amount}: ${winners.map(w=>`${w.name} (${w.handEval.name})`).join(', ')}`);
    if(pot.amount >= t.cfg.bigBlind*20 && Math.random() < 0.35){
      const speaker = Math.random()<0.5 ? winners[0] : contenders.find(p=>!winners.includes(p));
      if(speaker) tlog(t, `${speaker.name}: "${TABLE_CHATTER[Math.floor(Math.random()*TABLE_CHATTER.length)]}"`);
    }
  });
  if(humanWonThisHand){ t.stats.humanHandsWon++; t.stats.humanShowdownsWon++; sfxWin(); }
  t.pot = 0;
  finalizeHandVisuals(t, stacksBefore);
  finishHand(t);
}

/* Builds the win/loss result-banner data and kicks off stack count-up/down animations. */
function finalizeHandVisuals(t, stacksBefore){
  t.players.forEach(p=>{
    const before = stacksBefore[p.id];
    if(before!==undefined && before!==p.stack){
      startStackAnimation(t, p.id, before, p.stack);
    }
  });
  const human = t.players.find(p=>p.id===0);
  if(!human){ t.lastHandResult = null; return; }
  if(human.folded){ t.lastHandResult = null; return; } // they already know they folded — no banner needed
  const before = t.handStartStacks ? t.handStartStacks[0] : stacksBefore[0]; // whole-hand net, not just the payout instant
  const delta = human.stack - before;
  let opponentBestName = null;
  if(delta<0){
    const others = t.players.filter(p=>p.id!==0 && p.handEval);
    if(others.length){
      const shortDeck = t.cfg.bettingStructure==='shortdeck';
      let best = others[0];
      others.forEach(p=>{ if(compareEval(p.handEval, best.handEval, shortDeck)>0) best=p; });
      opponentBestName = best.handEval.name;
    }
  }
  t.lastHandResult = {
    type: delta>0 ? 'win' : (delta<0 ? 'lose' : 'push'),
    amount: Math.abs(delta),
    handName: human.handEval ? human.handEval.name : null,
    opponentBestName
  };
}

/* ---------------- Stack count-up animation (no-op safely outside a browser) ---------------- */
function startStackAnimation(t, playerId, from, to){
  if(from===to) return;
  t.animatingStacks = t.animatingStacks || {};
  const alreadyRunning = Object.keys(t.animatingStacks).length>0;
  t.animatingStacks[playerId] = {from, to, start: (typeof performance!=='undefined'?performance.now():Date.now()), duration: 700};
  if(!alreadyRunning) tickStackAnimations(t);
}
function tickStackAnimations(t){
  if(typeof window === 'undefined' || !window.requestAnimationFrame){ t.animatingStacks = {}; return; }
  const anims = t.animatingStacks || {};
  const ids = Object.keys(anims);
  if(ids.length===0) return;
  const now = performance.now();
  const stillRunning = ids.some(id => (now - anims[id].start) < anims[id].duration);
  render();
  if(stillRunning){
    window.requestAnimationFrame(()=>tickStackAnimations(t));
  } else {
    t.animatingStacks = {};
    render();
  }
}
function displayStackFor(t, p){
  const a = t.animatingStacks && t.animatingStacks[p.id];
  if(!a) return p.stack;
  const now = (typeof performance!=='undefined'?performance.now():Date.now());
  const frac = Math.min(1, (now - a.start) / a.duration);
  const eased = 1 - Math.pow(1-frac, 3);
  return Math.round(a.from + (a.to - a.from) * eased);
}

function finishHand(t){
  t.actingIdx = -1;
  if(t.cfg.isTournament){
    if(t.cfg.mtt){
      finishHandMtt(t);
    } else {
      t.players.forEach(p=>{
        if(!p.sitOut && p.stack<=0){
          p.sitOut = true;
          if(!t.tournament.finishOrder.includes(p.id)){
            t.tournament.finishOrder.push(p.id);
            const place = t.tournament.fieldSize - t.tournament.finishOrder.length + 1;
            tlog(t, `${p.name} is eliminated in ${ordinal(place)} place`);
          }
        }
      });
      const stillIn = t.players.filter(p=>!p.sitOut && p.stack>0);
      if(stillIn.length<=1 && !t.tournament.complete){
        t.tournament.complete = true;
        const winner = stillIn[0];
        tlog(t, winner ? `\ud83c\udfc6 ${winner.name} wins the tournament!` : 'Tournament complete.');
        computeTournamentPayouts(t);
      } else if(!t.tournament.complete){
        advanceTournamentLevel(t);
        const human = t.players.find(p=>p.id===0);
        if(human && human.sitOut){
          // Human is out — auto-continue so the rest of the field plays out at normal pace instead of stalling on a "Next Hand" click nobody can make.
          setTimeout(()=>{ if(state.table===t && !t.tournament.complete) startHand(t); }, 1400);
        }
      }
    }
  } else {
    t.players.forEach(p=>{ if(p.stack<=0) p.sitOut = true; });
  }
  render();
}

/* =========================================================
   MULTI-TABLE TOURNAMENT — Phase 2. Two tables (human's + one
   background, all-AI table), with table balancing and consolidation
   into a final table as the field shrinks. Deliberately scoped to two
   tables (not an arbitrary N) to keep the balancing/merge logic something
   that can actually be tested exhaustively rather than open-ended.
   ========================================================= */
function finishHandMtt(t){
  const mtt = state.mtt;
  if(!mtt) return;
  t.players.forEach(p=>{
    if(!p.sitOut && p.stack<=0){
      p.sitOut = true;
      if(!mtt.finishOrder.find(e=>e.globalId===p.globalId)){
        mtt.finishOrder.push({globalId:p.globalId, name:p.name, isHuman:p.isHuman});
        tlog(t, `${p.name} is eliminated`);
      }
    }
  });
  // Only the human's table drives shared round progression (level-ups, advancing the
  // background table, balancing, merge/completion checks) — background tables reaching
  // their own finishHand only need the elimination-recording above, to avoid double-processing.
  if(t === state.table){
    if(!mtt.complete){
      advanceBackgroundTables(mtt);
      breakEmptyBackgroundTables(mtt);
      rebalanceMttTables(mtt);
      checkMttMergeOrComplete(mtt);
    }
    if(!mtt.complete){
      advanceTournamentLevelMtt(mtt, t);
      const human = t.players.find(p=>p.isHuman);
      if(human && human.sitOut){
        setTimeout(()=>{ if(state.mtt===mtt && !mtt.complete) startHand(state.table); }, 1400);
      }
    }
  }
}

function liveMttTables(mtt){
  return [state.table, ...mtt.otherTables].filter(tb=>!tb.mttDissolved);
}

function advanceBackgroundTables(mtt){
  mtt.otherTables.forEach(bg=>{
    if(bg.mttDissolved) return;
    const withChips = bg.players.filter(p=>!p.sitOut && p.stack>0);
    if(withChips.length>=2) startHand(bg); // resolves synchronously in full — bg.cfg.allAI makes maybeRunAI instant
  });
}

function reseatPlayer(player, fromTable, toTable){
  fromTable.players = fromTable.players.filter(p=>p.globalId!==player.globalId);
  const newLocalId = fromTable===toTable ? player.id : (Math.max(-1, ...toTable.players.map(p=>p.id)) + 1);
  player.id = newLocalId;
  player.folded = false; player.currentBet = 0; player.totalContributed = 0;
  player.allIn = false; player.acted = false; player.holeCards = [];
  toTable.players.push(player);
  if(fromTable.dealerIdx >= fromTable.players.length) fromTable.dealerIdx = Math.max(0, fromTable.players.length-1);
}

/* With more than two tables, a background table can empty out to 0-1 players well before the
   overall field is small enough for the final merge. Rather than let it sit there indefinitely
   (a real cardroom would "break" that table), dissolve it immediately and reseat any lone
   survivor at whichever other live table currently has the fewest players. */
function breakEmptyBackgroundTables(mtt){
  mtt.otherTables.forEach(bg=>{
    if(bg.mttDissolved) return;
    const withChips = bg.players.filter(p=>!p.sitOut && p.stack>0);
    if(withChips.length>=2) return;
    const destinations = liveMttTables(mtt).filter(tb=>tb!==bg);
    if(destinations.length===0) return; // nothing to break into — completion check will handle it
    withChips.forEach(p=>{
      const counts = destinations.map(tb=>tb.players.filter(x=>!x.sitOut).length);
      const dest = destinations[counts.indexOf(Math.min(...counts))];
      reseatPlayer(p, bg, dest);
      tlog(dest, `${p.name} moves to this table (their table broke)`);
      if(dest===state.table) mtt.notice = `${p.name} has joined your table (their table broke).`;
    });
    bg.mttDissolved = true;
    tlog(state.table, `A table has broken \u2014 down to ${liveMttTables(mtt).length} table${liveMttTables(mtt).length===1?'':'s'}.`);
  });
}

function movePlayerForBalance(fromTable, toTable){
  const candidates = fromTable.players.filter(p=>!p.sitOut && !p.isHuman);
  if(candidates.length===0) return false;
  const mover = candidates[Math.floor(Math.random()*candidates.length)];
  reseatPlayer(mover, fromTable, toTable);
  tlog(toTable, `${mover.name} moves to this table (balancing)`);
  if(toTable===state.table) state.mtt.notice = `${mover.name} has joined your table.`;
  else if(fromTable===state.table) state.mtt.notice = `${mover.name} has been moved to another table.`;
  return true;
}

function rebalanceMttTables(mtt){
  const tables = liveMttTables(mtt);
  if(tables.length<2) return;
  const counts = tables.map(tb=> tb.players.filter(p=>!p.sitOut).length);

  // Priority: the human's own table must stay playable. If it's dropped below 2, pull a
  // player in immediately rather than waiting for the usual "differs by 2+" threshold.
  const humanIdx = tables.indexOf(state.table);
  if(counts[humanIdx] < 2){
    const otherCounts = counts.map((c,i)=> i===humanIdx ? -1 : c);
    const fromIdx = otherCounts.indexOf(Math.max(...otherCounts));
    if(fromIdx!==-1 && counts[fromIdx]>=2){
      movePlayerForBalance(tables[fromIdx], tables[humanIdx]);
      return;
    }
  }

  const maxI = counts.indexOf(Math.max(...counts));
  const minI = counts.indexOf(Math.min(...counts));
  if(maxI===minI || counts[maxI]-counts[minI] < 2) return;
  movePlayerForBalance(tables[maxI], tables[minI]);
}

function checkMttMergeOrComplete(mtt){
  const tables = liveMttTables(mtt);
  const totalRemaining = tables.reduce((s,tb)=> s + tb.players.filter(p=>!p.sitOut && p.stack>0).length, 0);

  if(totalRemaining<=1){
    mtt.complete = true;
    let winner = null;
    for(const tb of tables){ const w = tb.players.find(p=>!p.sitOut && p.stack>0); if(w) winner=w; }
    computeMttPayouts(mtt, winner);
    processCareerResult(mtt.placements, mtt.fieldSize);
    tlog(state.table, winner ? `\ud83c\udfc6 ${winner.name} wins the tournament!` : 'Tournament complete.');
    return;
  }
  if(tables.length>1 && totalRemaining<=mtt.tableSize){
    mtt.otherTables.forEach(bg=>{
      if(bg.mttDissolved) return;
      const survivors = bg.players.filter(p=>!p.sitOut && p.stack>0);
      survivors.forEach(p=> reseatPlayer(p, bg, state.table));
      bg.mttDissolved = true;
    });
    mtt.merged = true;
    mtt.notice = 'Final table! Everyone remaining is now seated together.';
    tlog(state.table, '— Final table — everyone remaining is now seated together —');
  }
}

function advanceTournamentLevelMtt(mtt, primaryTable){
  mtt.handsThisLevel++;
  if(mtt.handsThisLevel>=TOURNAMENT_HANDS_PER_LEVEL && mtt.level < TOURNAMENT_BLIND_LEVELS.length-1){
    mtt.level++;
    mtt.handsThisLevel = 0;
    const lvl = TOURNAMENT_BLIND_LEVELS[mtt.level];
    liveMttTables(mtt).forEach(tb=>{ tb.cfg.smallBlind = lvl.sb; tb.cfg.bigBlind = lvl.bb; });
    tlog(primaryTable, `— Blinds increase to $${lvl.sb}/$${lvl.bb} (Level ${mtt.level+1}) —`);
  }
}

function computeMttPayouts(mtt, winner){
  const pool = mtt.fieldSize * mtt.buyIn;
  const structure = payoutStructureFor(mtt.fieldSize);
  const placements = [];
  if(winner) placements.push({globalId:winner.globalId, name:winner.name, isHuman:winner.isHuman, place:1});
  for(let i=mtt.finishOrder.length-1, place=2; i>=0; i--, place++){
    const e = mtt.finishOrder[i];
    placements.push({globalId:e.globalId, name:e.name, isHuman:e.isHuman, place});
  }
  placements.forEach(p=>{ p.prize = Math.round(pool * (structure[p.place-1] || 0)); });
  mtt.placements = placements;
  return placements;
}

function startMultiTableTournament(tableSize, difficulty, tableCount, bettingStructure){
  tableCount = tableCount || 2;
  const firstLevel = TOURNAMENT_BLIND_LEVELS[0];
  const baseCfg = { seatCount:tableSize, startStack:TOURNAMENT_START_STACK, bigBlind:firstLevel.bb, smallBlind:firstLevel.sb, isTournament:true, mtt:true, bettingStructure };
  const tableA = initTable({...baseCfg, difficulty, allAI:false, idOffset:0});
  const others = [];
  for(let i=1;i<tableCount;i++){
    // Background tables always run Standard difficulty regardless of what the human's table
    // uses — nobody is watching these hands play out, and Hard mode's live per-decision equity
    // simulation compounds badly across several simultaneous tables (measured: a single human
    // hand could take 20-30+ seconds to resolve at 8-10 tables of Hard-mode AI, a real freeze).
    // This keeps per-hand latency low without changing the difficulty the player actually faces.
    others.push(initTable({...baseCfg, difficulty:'standard', allAI:true, idOffset:tableSize*i}));
  }
  const allTables = [tableA, ...others];
  let gid = 0;
  allTables.forEach(tb=> tb.players.forEach(p=>{ p.globalId = gid++; }));
  state.table = tableA;
  state.mtt = {
    fieldSize: tableSize*tableCount, tableSize, level:0, handsThisLevel:0, buyIn:TOURNAMENT_BUY_IN,
    finishOrder:[], complete:false, placements:null, otherTables:others, notice:null, merged:false
  };
}

const DECISION_CLOCK_SECONDS = 20; // visual pressure only in tournaments — no forced action on expiry

function decisionClockRemaining(t){
  if(!t.cfg.isTournament || !t.humanTurnStartedAt) return null;
  const elapsed = (Date.now() - t.humanTurnStartedAt) / 1000;
  return Math.max(0, Math.round(DECISION_CLOCK_SECONDS - elapsed));
}

let decisionClockInterval = null;
function startDecisionClockTicker(){
  if(typeof window==='undefined' || typeof window.setInterval!=='function') return; // safe no-op outside a browser
  if(decisionClockInterval) return;
  decisionClockInterval = setInterval(()=>{
    const t = state.table;
    if(!t || !t.cfg.isTournament || t.actingIdx!==0 || t.stage==='idle' || t.stage==='showdown'){
      clearInterval(decisionClockInterval);
      decisionClockInterval = null;
      return;
    }
    renderMain(); // just refresh the visible countdown — not a full render() cycle every second
  }, 1000);
}

function maybeRunAI(t){
  if(t.stage==='idle' || t.stage==='showdown') return;
  const p = t.players.find(x=>x.id===t.actingIdx);
  if(!p) { checkRoundProgress(t); return; }
  if(p.isHuman){
    t.humanTurnStartedAt = Date.now();
    startDecisionClockTicker();
    render();
    return;
  }
  if(t.cfg.allAI){
    // Background MTT table — nobody's watching this one live, so resolve instantly instead of
    // pacing with the human-realism delay. This lets a whole background hand play out in one
    // synchronous call chain (still using the exact same applyAction/proceedTurn/aiDecision as normal play).
    const action = aiDecision(p, t);
    applyAction(t, p.id, action);
    proceedTurn(t);
    return;
  }
  t.waiting = true; render();
  setTimeout(()=>{
    const action = aiDecision(p, t);
    applyAction(t, p.id, action);
    t.waiting = false;
    proceedTurn(t);
  }, 550+Math.random()*450);
}

/* =========================================================
   HARD-MODE AI — reuses the tested subsystems (Chen position ranges,
   opener-aware 3-bet math from Preflop Position, and Monte Carlo
   equity from Pot Odds & Equity) instead of a fresh heuristic.
   ========================================================= */
function seatFormatForCount(n){ return n===2?'hu' : n===6?'6max' : n===9?'9max' : null; }

function seatIndexForPlayer(t, playerId){
  const list = activePlayers(t);
  const n = list.length;
  const i = list.findIndex(p=>p.id===playerId);
  if(i===-1) return null;
  if(n===2) return (i - t.dealerIdx + n) % n; // dealer/BTN-SB -> 0, other -> 1
  const utgIdx = (t.dealerIdx + 3) % n;
  return (i - utgIdx + n) % n;
}

function hardModeSeatInfo(t, playerId){
  if(playerId==null) return null;
  const n = activePlayers(t).length;
  const fmt = seatFormatForCount(n);
  if(!fmt) return null;
  const idx = seatIndexForPlayer(t, playerId);
  const seats = POSITION_FORMATS[fmt].seats;
  if(idx==null || idx<0 || idx>=seats.length) return null;
  return {format:fmt, seat:seats[idx], seats, idx};
}

function handTypeForCards(holeCards){
  const [hi,lo] = holeCards.map(c=>c.r).sort((a,b)=>b-a);
  const suited = holeCards[0].s===holeCards[1].s;
  const label = hi===lo ? chLabel(hi)+chLabel(hi) : chLabel(hi)+chLabel(lo)+(suited?'s':'o');
  return HAND_TYPE_MAP[label];
}

// How wide the Big Blind defends preflop, by table format. BB gets the best price in the hand
// (already committed, closes the action) so it defends noticeably wider than an equivalent-strength
// seat opening cold would — these are simplified, fixed widths rather than a solved BB defense chart.
const BB_DEFEND_PCT = {hu:55, '6max':42, '9max':36};

function hardModePreflopDecision(player, t){
  const info = hardModeSeatInfo(t, player.id);
  if(!info) return null; // unsupported table size -> fall back to standard heuristic
  const type = handTypeForCards(player.holeCards);
  const toCall = t.currentBet - player.currentBet;
  const facingRealRaise = t.currentBet > t.cfg.bigBlind;
  const potForSizing = t.pot || t.cfg.bigBlind*2;

  if(info.seat.pct==null){
    // Big Blind. No "opening frequency" applies here — model it as a defend range instead.
    const bbPct = BB_DEFEND_PCT[info.format] || 40;
    if(!facingRealRaise){
      // Nobody raised: checking is free, so only raise for real value; otherwise take the free look.
      const raiseZone = Math.min(20, bbPct*0.5);
      if(type.cumPct<=raiseZone){
        const raiseTo = Math.max(t.cfg.bigBlind*3, player.currentBet+toCall+t.cfg.bigBlind*2);
        return {type: toCall>0?'raise':'bet', amount: raiseTo};
      }
      return toCall>0 ? {type:'call'} : {type:'check'};
    }
    const openerInfo = hardModeSeatInfo(t, t.lastAggressorId);
    const openerPct = (openerInfo && openerInfo.seat.pct!=null) ? openerInfo.seat.pct : 20;
    const cls = classifyFacingRaise(type, bbPct, openerPct);
    if(cls==='3bet'){
      const size = Math.round(toCall + potForSizing*0.9);
      return {type:'raise', amount: player.currentBet + toCall + size};
    }
    if(cls==='call') return {type:'call'};
    return {type:'fold'};
  }

  if(!facingRealRaise){
    const inRange = type.cumPct <= info.seat.pct;
    if(inRange){
      const raiseTo = Math.max(t.cfg.bigBlind*3, player.currentBet + toCall + t.cfg.bigBlind*2);
      return {type: toCall>0?'raise':'bet', amount: raiseTo};
    }
    return toCall>0 ? {type:'fold'} : {type:'check'};
  }

  const openerInfo = hardModeSeatInfo(t, t.lastAggressorId);
  const openerPct = (openerInfo && openerInfo.seat.pct!=null) ? openerInfo.seat.pct : 20; // generic proxy when the true opener's seat isn't resolvable
  const cls = classifyFacingRaise(type, info.seat.pct, openerPct);
  if(cls==='3bet'){
    const size = Math.round(toCall + potForSizing*0.9);
    return {type:'raise', amount: player.currentBet + toCall + size};
  }
  if(cls==='call') return {type:'call'};
  return {type:'fold'};
}

/* =========================================================
   TABLE IMAGE & EXPLOITS — the Hold'em-appropriate analogue to
   Heat & Camouflage: instead of a pit boss watching your bet
   sizing, opponents build a real read on how you actually play
   (VPIP/PFR/aggression), and Hard-mode AI genuinely exploits it —
   folding more to a tight image's bets, calling lighter and
   bluffing less against a loose one. Needs a minimum sample size
   before adjusting anything, so a handful of hands can't skew it.
   ========================================================= */
function newHumanImage(){
  return { handsObserved:0, vpipCount:0, pfrCount:0, aggroPostflop:0, passivePostflop:0, vpipCountedThisHand:false, pfrCountedThisHand:false };
}
function trackHumanImage(t, p, actionType){
  if(!p.isHuman || !t.humanImage) return;
  const img = t.humanImage;
  if(t.stage==='preflop'){
    if((actionType==='call' || actionType==='bet' || actionType==='raise') && !img.vpipCountedThisHand){
      img.vpipCount++; img.vpipCountedThisHand = true;
    }
    if((actionType==='bet' || actionType==='raise') && !img.pfrCountedThisHand){
      img.pfrCount++; img.pfrCountedThisHand = true;
    }
  } else {
    if(actionType==='bet' || actionType==='raise') img.aggroPostflop++;
    else if(actionType==='call') img.passivePostflop++;
  }
}
function humanImageRead(t){
  const img = t.humanImage;
  if(!img || img.handsObserved < 15) return null; // not enough data yet — don't overreact to a small sample
  const vpipPct = img.vpipCount / img.handsObserved;
  const pfrPct = img.pfrCount / img.handsObserved;
  const af = img.passivePostflop>0 ? img.aggroPostflop/img.passivePostflop : (img.aggroPostflop>0 ? 99 : 0);
  return {vpipPct, pfrPct, af, handsObserved:img.handsObserved};
}
function imageExploitAdjustment(t){
  const read = humanImageRead(t);
  if(!read) return {callEquityAdj:0, bluffFreqAdj:0};
  const looseness = Math.max(-0.2, Math.min(0.35, read.vpipPct - 0.25)); // baseline ~25% VPIP; clamp against wild extrapolation
  return {
    callEquityAdj: -looseness * 0.15, // loose human -> AI needs LESS equity to call; tight -> needs MORE
    bluffFreqAdj: -looseness * 0.12,  // loose human -> AI bluffs LESS (won't get through); tight -> bluffs MORE (folds a lot)
  };
}

function hardModePostflopDecision(player, t){
  const toCall = t.currentBet - player.currentBet;
  const isShortDeck = t.cfg.bettingStructure==='shortdeck';
  const equity = estimateEquity(player.holeCards, t.board, 150, isShortDeck?buildShortDeck:buildDeck, isShortDeck); // fewer trials than the teaching drill (1200) to stay responsive in live play
  const adj = imageExploitAdjustment(t);
  const potOddsNeeded = Math.max(0.02, (toCall>0 ? toCall/(t.pot+toCall*2) : 0) + adj.callEquityAdj);
  const potForSizing = t.pot || t.cfg.bigBlind*2;

  if(toCall<=0){
    if(equity > 0.62){
      const size = Math.round(potForSizing*0.66);
      return {type:'bet', amount: player.currentBet+size};
    }
    const bluffFreq = Math.max(0, Math.min(0.9, bluffFreqGeneral(0.66, 0) + adj.bluffFreqAdj));
    if(equity < 0.35 && Math.random() < bluffFreq*0.5){
      const size = Math.round(potForSizing*0.66);
      return {type:'bet', amount: player.currentBet+size};
    }
    return {type:'check'};
  }
  if(equity >= potOddsNeeded){
    if(equity > 0.78 && Math.random() < 0.4){
      const size = Math.round(toCall + potForSizing*0.75);
      return {type:'raise', amount: player.currentBet+toCall+size};
    }
    return {type:'call'};
  }
  return {type:'fold'};
}

function aiDecision(player, t){
  if(t.cfg.difficulty==='hard'){
    const hardResult = t.stage==='preflop' ? hardModePreflopDecision(player, t) : hardModePostflopDecision(player, t);
    if(hardResult) return hardResult;
    // falls through to the standard heuristic below (only when the table size isn't supported)
  }
  const stage = t.stage;
  const strength = stage==='preflop' ? preflopScore(player.holeCards) : postflopScore(player.holeCards, t.board, t.cfg.bettingStructure==='shortdeck');
  const p = player.personality;
  const aggFactor = p==='aggro'?1.3 : p==='loose'?1.1 : p==='tight'?0.8 : 1.0;
  const callThreshold = p==='tight'?0.45 : p==='loose'?0.25 : p==='aggro'?0.32 : 0.35;
  const bluffChance = p==='aggro'?0.18 : p==='loose'?0.12 : p==='tight'?0.03 : 0.07;
  const toCall = t.currentBet - player.currentBet;
  const potOddsNeeded = toCall>0 ? toCall/(t.pot+toCall*2) : 0;
  const bluffing = Math.random() < bluffChance;
  const effStrength = strength + (bluffing?0.3:0);

  if(toCall<=0){
    if(strength > 0.62/aggFactor || bluffing){
      const size = Math.max(t.cfg.bigBlind, Math.round((t.pot||t.cfg.bigBlind*2) * (0.5+Math.random()*0.5)));
      return {type:'bet', amount: player.currentBet + size};
    }
    return {type:'check'};
  }
  if(effStrength >= Math.max(callThreshold, potOddsNeeded)){
    if(strength > 0.78/aggFactor && Math.random() < 0.45*aggFactor){
      const size = Math.round(toCall + (t.pot||t.cfg.bigBlind*2)*(0.5+Math.random()*0.5));
      return {type:'raise', amount: player.currentBet + toCall + size};
    }
    return {type:'call'};
  }
  return {type:'fold'};
}

function proceedTurn(t){
  if(onlyOneLeft(t)){ goToShowdown(t); render(); return; }
  if(bettingRoundDone(t)){
    advanceStreet(t);
    render();
    if(t.stage==='showdown'){ return; }
    maybeRunAI(t);
    return;
  }
  t.actingIdx = nextIdx(t, t.actingIdx);
  if(t.actingIdx===-1){
    advanceStreet(t);
    render();
    if(t.stage!=='showdown') maybeRunAI(t);
    return;
  }
  render();
  maybeRunAI(t);
}

function checkRoundProgress(t){ proceedTurn(t); }

function humanAction(type, amount){
  const t = state.table;
  if(!t || t.waiting) return;
  const p = t.players.find(x=>x.id===0);
  if(t.actingIdx!==0) return;
  applyAction(t, 0, {type, amount});
  proceedTurn(t);
}

  const angle = (Math.PI*2*i/n) - Math.PI/2;
  const rx = 44, ry = 42;
  const left = 50 + rx*Math.cos(angle);
  const top = 50 + ry*Math.sin(angle);
  return {left:left+'%', top:top+'%'};
}

  if(career.bankroll < cost){
    const canOffer = career.markers.length < MAX_ACTIVE_MARKERS && !career.declinedOffer;

    }
    if(!career.brokeCounted){ career.timesBroke = (career.timesBroke||0) + 1; career.brokeCounted = true; }
    return renderCareerGameOver(career, tier, cost);
  }
  const isFinalTier = career.tier === CAREER_TIERS.length-1;
  const progressPct = isFinalTier ? 100 : Math.min(100, Math.round((career.tierPoints/tier.pointsToAdvance)*100));

  let resultHTML = '';
  if(career.lastResult){
    const r = career.lastResult;
    if(r.isFinalBoss){
      resultHTML = `
        <div class="explain-box" style="margin-top:14px; ${r.finalBossWon?'border-color:var(--gold-bright);':''}">
          <div><b>${r.tierName}</b> result: ${ordinal(r.place)} of ${r.fieldSize} &mdash; ${r.prize>0?`won $${r.prize.toLocaleString()}`:'no prize'}</div>
          ${r.finalBossWon ? `<div style="margin-top:6px; color:var(--gold-bright); font-weight:700; font-size:1.05rem;">\ud83c\udfc6 You beat ${FINAL_BOSS_NAME}. Top of the mountain.</div>` : `<div style="margin-top:6px; color:var(--cream-dim);">${FINAL_BOSS_NAME} gets to keep her seat. You can always challenge her again.</div>`}
        </div>`;
    } else {
      resultHTML = `
        <div class="explain-box" style="margin-top:14px;">
          <div><b>${r.tierName}</b> result: ${ordinal(r.place)} of ${r.fieldSize} &mdash; ${r.prize>0?`won $${r.prize}`:'no prize'}, +${r.points} ranking points</div>
          ${r.isChampion ? `<div style="margin-top:6px; color:var(--gold-bright); font-weight:700;">\ud83c\udfc6 Championship win! You're a certified #1.</div>` : ''}
          ${r.promoted ? `<div style="margin-top:6px; color:var(--gold-bright); font-weight:700;">Promoted to ${r.newTierName}!</div>` : ''}
        </div>`;
    }
  }

  const bettingStructureLabel = {nolimit:'No-Limit', potlimit:'Pot-Limit', limit:'Limit', shortdeck:'Short-Deck (6+)'};
  const tierRows = CAREER_TIERS.map((tr,i)=>`
    <tr style="${i===career.tier?'color:var(--gold-bright); font-weight:700;':(i<career.tier?'color:var(--cream-dim);':'opacity:0.5;')}">
      <td>${i<career.tier?'\u2713':(i===career.tier?'\u25b6':'')} ${tr.name}</td>
      <td>${tr.mtt?'Multi-Table':'Single-Table'}, ${tr.tableSize==6?'6-Max':'Full Ring'}</td>
      <td>${bettingStructureLabel[tr.bettingStructure]}</td>
      <td>${tr.difficulty==='hard'?'Hard':'Standard'}</td>
      <td>$${careerEntryCost(tr)}</td>
    </tr>`).join('');

  const markersHTML = career.markers.length>0 ? `
    <div class="card-box" style="margin-top:16px; border-color:var(--bad);">
      <h3 style="margin-top:0; color:var(--bad);">Outstanding Markers</h3>
      ${career.markers.map(m=>`
        <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:8px;">
          <div class="pill">Owe $${m.owed} &mdash; due in ${m.dueIn} tournament${m.dueIn===1?'':'s'}</div>
          <button class="btn${career.bankroll>=m.owed?' primary':''}" data-repaymarker="${m.id}" ${career.bankroll<m.owed?'disabled':''}>Repay $${m.owed}</button>
        </div>`).join('')}
    </div>` : '';

  const invited = !!(state.lifetime && state.lifetime.earned['valentine_invite']);
  const finalBossHTML = invited ? `
    <div class="card-box" style="margin-top:16px; border-color:var(--gold-bright); background:linear-gradient(160deg, rgba(232,193,79,0.08), var(--panel));">
      <h3 style="margin-top:0; color:var(--gold-bright);">\ud83c\udfc6 The ${FINAL_BOSS_NAME} Invitational</h3>
      <div class="muted">You've built the kind of bankroll that gets noticed. ${FINAL_BOSS_NAME} — scream queen extraordinaire before she was ever a poker legend, and the toughest seat in the game either way — has invited you to a private 10-table, $${FINAL_BOSS_BUY_IN.toLocaleString()} buy-in event. ${career.finalBossWon ? "You've already beaten her once. Nothing's stopping you from doing it again." : 'No pressure. Just everything.'}</div>
      <div class="btn-row" style="margin-top:10px;">
        <button class="btn primary" id="btnStartFinalBoss" ${career.bankroll<FINAL_BOSS_BUY_IN?'disabled':''}>Enter the Invitational (${career.bankroll<FINAL_BOSS_BUY_IN?`need $${FINAL_BOSS_BUY_IN.toLocaleString()}`:`$${FINAL_BOSS_BUY_IN.toLocaleString()}`})</button>
      </div>
    </div>` : '';

  return `
    <div class="card-box">
      <h2>Your Poker Career</h2>
      <div class="muted">Climb from weeknight local games to the majors. Every event here is a real tournament (reusing everything already tested in Tournament mode) — the tier just decides the format, betting structure, stakes, and entry cost automatically. Career progress is saved automatically in this browser.</div>
      <table class="ref" style="margin-top:14px;">
        <tr><th>League</th><th>Format</th><th>Betting</th><th>AI</th><th>Buy-in</th></tr>
        ${tierRows}
      </table>
      <div style="margin-top:14px;">
        <div class="pill">Current: ${tier.name}</div>
        ${!isFinalTier ? `<div class="pill">Tier progress: ${career.tierPoints} / ${tier.pointsToAdvance} pts (${progressPct}%)${infoIcon('Points from this tier only. Win an event for 100 points, down to 5 for a min-cash finish. Reach the threshold and you\u2019re promoted to the next league.')}</div>` : `<div class="pill">Top tier reached &mdash; championships won: ${career.championshipsWon}</div>`}
        <div class="pill">Career points: ${career.totalPoints}${infoIcon('Every point you\u2019ve ever earned across your whole career, even after being promoted \u2014 unlike Tier Progress, this never resets.')}</div>
        <div class="pill">Career bankroll: $${career.bankroll}${infoIcon('Your running total of tournament winnings minus what you\u2019ve paid in buy-ins and repaid markers. Run it to zero (below the next entry cost) with no marker available and your career ends \u2014 there\u2019s no rebuy.')}</div>
        <div class="pill">Next entry cost: $${cost}</div>
        <div class="pill">Events played: ${career.tournamentsPlayed}</div>
      </div>
      ${markersHTML}
      ${finalBossHTML}
      ${resultHTML}
      <div class="muted" style="margin-top:10px;">${tier.blurb}</div>
      <div class="btn-row" style="margin-top:14px;">
        <button class="btn primary" id="btnStartCareerEvent">${career.tournamentsPlayed===0?'Enter Your First Event':'Enter Next Event'}</button>
        <button class="btn danger" id="btnResetCareer">Reset Career</button>
      </div>
    </div>`;
}

function renderDecisionClock(t){
  const remaining = decisionClockRemaining(t);
  if(remaining===null) return '';
  const pct = Math.max(0, Math.min(100, (remaining/DECISION_CLOCK_SECONDS)*100));
  const urgent = remaining <= 5;
  return `
    <div style="max-width:320px; margin:0 auto 8px;">
      <div style="display:flex; justify-content:space-between; font-size:0.68rem; color:${urgent?'var(--bad)':'var(--cream-dim)'}; font-family:'JetBrains Mono',monospace;">
        <span>On the clock</span><span>${remaining}s</span>
      </div>
      <div style="height:4px; background:var(--panel-2); border-radius:4px; overflow:hidden; margin-top:2px;">
        <div style="height:100%; width:${pct}%; background:${urgent?'var(--bad)':'var(--gold)'}; transition:width 1s linear;"></div>
      </div>
    </div>`;
}

function renderResultBanner(t){
  if(t.stage!=='showdown' || !t.lastHandResult) return '';
  const r = t.lastHandResult;
  if(r.type==='win'){
    return `<div class="result-banner win">
      <div class="result-title">YOU WIN $${r.amount}</div>
      <div class="result-sub">${r.handName ? `with ${r.handName}` : 'everyone else folded'}</div>
    </div>`;
  }
  if(r.type==='lose'){
    return `<div class="result-banner lose">
      <div class="result-title">YOU LOSE $${r.amount}</div>
      ${r.opponentBestName ? `<div class="result-sub">beaten by ${r.opponentBestName}</div>` : ''}
    </div>`;
  }
  return `<div class="result-banner push"><div class="result-title">PUSH</div></div>`;
}

function renderCashGameOver(t){
  return `
    <div class="card-box" style="text-align:center;">
      <h2>Game Over</h2>
      <div class="muted" style="font-size:1rem; margin:14px 0;">You're out of chips. Add more to keep playing this table, or head back to set up something new.</div>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn primary" id="btnRebuy">Add $${t.cfg.startStack} in Chips</button>
        <button class="btn" id="btnGameOverSetup">Return to Setup</button>
      </div>
    </div>`;
}

function renderPlay(){
  const t = state.table;
  if(state.audio.music.enabled) setMusicTheme(desiredMusicTheme());
  if(!state.career) state.career = newCareerState();
  const modeSelector = !t ? `
    <div class="btn-row" style="margin-bottom:4px;">
      <button class="btn${state.playMode==='cash'?' primary':''}" id="modeCash">Cash Game</button>
      <button class="btn${state.playMode==='tournament'?' primary':''}" id="modeTournament">Tournament</button>
      <button class="btn${state.playMode==='career'?' primary':''}" id="modeCareer">Career</button>
    </div>` : '';

  if(!t && state.playMode==='career'){
    return modeSelector + renderCareerHome();
  }

  let cfgHTML;
  if(!t && state.playMode==='tournament'){
    cfgHTML = `
    <div class="card-box">
      ${modeSelector}
      <h2>Tournament Setup</h2>
      <div class="muted">Blinds rise every ${TOURNAMENT_HANDS_PER_LEVEL} hands, no rebuys — last one standing wins. Starting stack: $${TOURNAMENT_START_STACK}.</div>
      <div style="display:flex; gap:16px; flex-wrap:wrap; margin-top:10px;">
        <label class="field">Format
          <select id="cfgTourneyType">
            <option value="single" selected>Single Table</option>
            <option value="multi">Multi-Table</option>
          </select>
        </label>
        <label class="field">Table Size
          <select id="cfgTourneySeats">
            <option value="6" selected>6-Max</option>
            <option value="9">Full Ring (9)</option>
          </select>
        </label>
        <label class="field" id="cfgTourneyTablesWrap" style="display:none;">Number of Tables
          <select id="cfgTourneyTables">
            <option value="2" selected>2 Tables</option>
            <option value="3">3 Tables</option>
            <option value="4">4 Tables</option>
            <option value="6">6 Tables</option>
            <option value="8">8 Tables</option>
            <option value="10">10 Tables</option>
          </select>
        </label>
        <label class="field">AI Difficulty
          <select id="cfgTourneyDifficulty">
            <option value="standard" selected>Standard</option>
            <option value="hard">Hard</option>
          </select>
        </label>
        <label class="field">Betting Structure
          <select id="cfgTourneyBettingStructure">
            <option value="nolimit" selected>No-Limit</option>
            <option value="potlimit">Pot-Limit</option>
            <option value="limit">Limit</option>
            <option value="shortdeck">Short-Deck (6+), No-Limit</option>
          </select>
        </label>
      </div>
      <div class="muted" style="margin-top:6px; font-size:0.78rem;">Multi-Table seats additional all-AI tables alongside yours — players get moved between tables to keep them balanced as the field shrinks, tables that empty out break and reseat their last players elsewhere, and everyone merges onto one final table once few enough remain.</div>
      <div class="pill">Buy-in $${TOURNAMENT_BUY_IN} per player${infoIcon('A virtual entry fee \u2014 all buy-ins form the prize pool, which gets split among the top finishers when the tournament ends.')}</div>
      <div class="pill">Fields up to 20 players pay top 4 (40/27/19/14%)</div>
      <div class="pill">Larger fields pay top 7 (30/20/15/12/10/8/5%)</div>
      <div class="pill">Single Table pays top 2 (6-Max) or top 3 (Full Ring)</div>
      <div class="btn-row">
        <button class="btn primary" id="btnStartTournament">Start Tournament</button>
      </div>
    </div>`;
  } else if(!t){
    cfgHTML = `
    <div class="card-box">
      ${modeSelector}
      <h2>Table Setup</h2>
      <div class="muted">Pick a format — you can change this anytime between hands.</div>
      <div style="display:flex; gap:16px; flex-wrap:wrap; margin-top:10px;">
        <label class="field">Seats
          <select id="cfgSeats">
            <option value="2">Heads-Up (2)</option>
            <option value="6" selected>6-Max</option>
            <option value="9">Full Ring (9)</option>
          </select>
        </label>
        <label class="field">Your Seat
          <select id="cfgHumanSeat">
            <option value="0">Seat 1</option>
            <option value="1">Seat 2</option>
            <option value="2" selected>Seat 3</option>
            <option value="3">Seat 4</option>
            <option value="4">Seat 5</option>
            <option value="5">Seat 6</option>
            <option value="6">Seat 7</option>
            <option value="7">Seat 8</option>
            <option value="8">Seat 9</option>
          </select>
        </label>
        <label class="field">Starting Stack
          <select id="cfgStack">
            <option value="100">$100</option>
            <option value="200" selected>$200</option>
            <option value="500">$500</option>
          </select>
        </label>
        <label class="field">Blinds
          <select id="cfgBlinds">
            <option value="1,2" selected>$1 / $2</option>
            <option value="2,5">$2 / $5</option>
            <option value="5,10">$5 / $10</option>
          </select>
        </label>
        <label class="field">AI Difficulty
          <select id="cfgDifficulty">
            <option value="standard" selected>Standard</option>
            <option value="hard">Hard</option>
          </select>
        </label>
        <label class="field">Betting Structure
          <select id="cfgBettingStructure">
            <option value="nolimit" selected>No-Limit</option>
            <option value="potlimit">Pot-Limit</option>
            <option value="limit">Limit</option>
            <option value="shortdeck">Short-Deck (6+), No-Limit</option>
          </select>
        </label>
      </div>
      <div class="muted" style="margin-top:6px; font-size:0.78rem;">Hard mode plays real position-based opening/3-bet ranges preflop and live equity-vs-pot-odds postflop instead of the simplified heuristic — noticeably tougher, and can be a bit slower to act on older devices. Pot-Limit caps every bet and raise at the current pot size — see the Hold'em Variants tab for the exact math.</div>
      <div class="btn-row">
        <button class="btn primary" id="btnStartTable">Start Table</button>
      </div>
    </div>`;
  }

  if(!t){ return cfgHTML; }

  const isMtt = !!t.cfg.mtt;
  const tourComplete = isMtt ? (state.mtt && state.mtt.complete) : (t.cfg.isTournament && t.tournament.complete);

  if(t.cfg.isTournament && tourComplete){
    return isMtt ? renderMttComplete(state.mtt) : renderTournamentComplete(t);
  }

  if(!t.cfg.isTournament){
    cfgHTML = `<div class="card-box" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
      <div class="muted">Cash game &middot; ${t.cfg.seatCount}-max &middot; Blinds $${t.cfg.smallBlind}/$${t.cfg.bigBlind} &middot; Difficulty: ${t.cfg.difficulty==='hard'?'Hard':'Standard'} &middot; ${t.cfg.bettingStructure==='potlimit'?'Pot-Limit':t.cfg.bettingStructure==='limit'?'Limit':t.cfg.bettingStructure==='shortdeck'?'Short-Deck (6+)':'No-Limit'}</div>
      <button class="btn" id="btnStartTable">Restart Table</button>
    </div>`;
    const human = t.players.find(p=>p.isHuman);
    if(human && human.sitOut){
      return cfgHTML + renderCashGameOver(t);
    }
  } else {
    cfgHTML = '';
  }

  let tourneyStatusHTML = '';
  if(t.cfg.isTournament){
    const human = t.players.find(p=>p.isHuman);
    let remaining, fieldSize, level, handsLeft, tablesRemaining, notice;
    if(isMtt){
      const mtt = state.mtt;
      const live = liveMttTables(mtt);
      remaining = live.reduce((s,tb)=>s+tb.players.filter(p=>!p.sitOut && p.stack>0).length, 0);
      fieldSize = mtt.fieldSize; level = mtt.level; handsLeft = TOURNAMENT_HANDS_PER_LEVEL - mtt.handsThisLevel;
      tablesRemaining = live.length; notice = mtt.notice; mtt.notice = null; // show once
    } else {
      remaining = t.players.filter(p=>!p.sitOut && p.stack>0).length;
      fieldSize = t.tournament.fieldSize; level = t.tournament.level;
      handsLeft = t.tournament.handsPerLevel - t.tournament.handsThisLevel;
      tablesRemaining = 1; notice = null;
    }
    tourneyStatusHTML = `
      <div class="card-box">
        <h2>Tournament — Level ${level+1}</h2>
        <div class="pill">Blinds $${t.cfg.smallBlind}/$${t.cfg.bigBlind}</div>
        <div class="pill">Next level in ${handsLeft} hand${handsLeft===1?'':'s'}${infoIcon('Blinds rise on a fixed schedule regardless of stack sizes \u2014 this is what forces the action as a tournament goes on and stacks get relatively shallower.')}</div>
        <div class="pill">${remaining} of ${fieldSize} players remain</div>
        ${isMtt && tablesRemaining>1 ? `<div class="pill">${tablesRemaining} tables in play${infoIcon('Your table plays out normally while another all-AI table runs in the background at the same pace. Players get moved between tables to keep them balanced as the field shrinks.')}</div>` : ''}
        ${human.sitOut ? `<div class="pill" style="background:var(--bad); color:#fff; border-color:#a13d2c;">You're out \u2014 spectating the rest of the field</div>` : `<div class="pill">Your stack: $${human.stack}</div>`}
        ${notice ? `<div class="pill" style="background:var(--gold); color:#20200c; border-color:var(--gold-bright);">${notice}</div>` : ''}
        <div class="btn-row"><button class="btn danger" id="btnAbandonTournament">Abandon Tournament</button></div>
      </div>`;
  }

  const list = activePlayers(t);
  const seatsHTML = list.map((p,i)=>{
    const pos = seatPosition(i, list.length);
    const isDealer = i===t.dealerIdx;
    const showCards = p.isHuman || t.stage==='showdown';
    const cardsHTML = p.folded ? '' : `<div class="cards">${
      p.holeCards.map(c=> showCards ? cardHTML(c,{size:'sm'}) : cardHTML(null,{size:'sm'})).join('')
    }</div>`;
    return `<div class="seat${p.id===t.actingIdx?' active-turn':''}${p.folded?' folded':''}" style="left:${pos.left}; top:${pos.top};">
      ${isDealer?'<div class="dealer-btn" title="Dealer button — this seat acts last after the flop this hand, the biggest positional advantage at the table">D</div>':''}
      <div class="name">${p.name}${p.isHuman?' (you)':''}</div>
      <div class="stack">$${displayStackFor(t,p)}</div>
      ${p.currentBet>0?`<div class="bet-tag">${chipStackHTML(p.currentBet)}$${p.currentBet}</div>`:''}
      ${cardsHTML}
      ${t.stage==='showdown' && !p.folded && p.handEval ? `<div class="bet-tag">${p.handEval.name}</div>` : ''}
    </div>`;
  }).join('');

  const human = t.players.find(p=>p.id===0);
  const humanTurn = t.actingIdx===0 && !t.waiting && t.stage!=='idle' && t.stage!=='showdown';
  const toCall = human ? t.currentBet - human.currentBet : 0;

  let actionHTML;
  if(t.stage==='idle'){
    actionHTML = `<div class="muted">Click "Start Table" above, then deal the first hand.</div>
      <div class="btn-row"><button class="btn primary" id="btnDeal">Deal Hand <span class="key-badge">Enter</span></button></div>`;
  } else if(t.stage==='showdown'){
    actionHTML = `<div class="btn-row"><button class="btn primary" id="btnNextHand">Next Hand <span class="key-badge">Enter</span></button></div>`;
  } else if(humanTurn){
    const potForSizing = t.pot || t.cfg.bigBlind*2;
    const isPotLimit = t.cfg.bettingStructure==='potlimit';
    const isLimit = t.cfg.bettingStructure==='limit';
    if(t.cfg.forcedThrow){
      actionHTML = `
        <div class="muted" style="text-align:center; width:100%; color:var(--bad);">You're laying this one down to satisfy your marker.</div>
        <button class="btn danger" id="actFold">Fold <span class="key-badge">1</span></button>
      `;
    } else if(isLimit){
      const fixedSize = limitBetSize(t);
      const capped = (t.betsThisStreet||0) >= 4;
      const raiseLabel = t.currentBet>0 ? 'Raise to' : 'Bet';
      actionHTML = `
        <button class="btn danger" id="actFold">Fold <span class="key-badge">1</span></button>
        <button class="btn" id="actCheckCall">${toCall>0? `Call $${Math.min(toCall,human.stack)}` : 'Check'} <span class="key-badge">2</span></button>
        ${!capped ? `<button class="btn primary" id="actBetHalf">${raiseLabel} $${t.currentBet+fixedSize} <span class="key-badge">3</span></button>` : `<div class="muted" style="align-self:center;">Betting capped this street (4 bets max)</div>`}
      `;
    } else {
      const maxLegalTotal = isPotLimit ? Math.min(human.currentBet+human.stack, maxPotRaiseTotal(t, human)) : (human.currentBet+human.stack);
      const maxLegalPut = maxLegalTotal - human.currentBet;
      actionHTML = `
        <button class="btn danger" id="actFold">Fold <span class="key-badge">1</span></button>
        <button class="btn" id="actCheckCall">${toCall>0? `Call $${Math.min(toCall,human.stack)}` : 'Check'} <span class="key-badge">2</span></button>
        <button class="btn primary" id="actBetHalf">${t.currentBet>0?'Raise':'Bet'} ½ Pot ($${Math.round(potForSizing*0.5)}) <span class="key-badge">3</span></button>
        <button class="btn primary" id="actBetPot">${t.currentBet>0?'Raise':'Bet'} Pot ($${potForSizing}) <span class="key-badge">4</span></button>
        <button class="btn" id="actAllIn">${isPotLimit?'Max Raise':'All-In'} ($${maxLegalPut}) <span class="key-badge">5</span></button>
      `;
    }
  } else {
    actionHTML = `<div class="muted">${t.waiting?'Waiting on opponents…':'Waiting…'}</div>`;
  }

  return cfgHTML + tourneyStatusHTML + `
    <div class="card-box">
      <div class="table-wrap">
        <div class="felt"></div>
        <div class="board-area">
          <div class="pot-line">${chipStackHTML(t.pot)}Pot: $${t.pot}${t.stage!=='idle'?` &middot; ${t.stage.toUpperCase()}`:''}${infoIcon('The pot is everyone\u2019s bets combined this hand \u2014 whoever has the best hand at showdown (or whoever\u2019s left if everyone else folds) wins it.')}</div>
          <div class="card-row" style="justify-content:center;">
            ${t.board.map(c=>cardHTML(c)).join('') || '<span class="muted">Community cards appear here</span>'}
          </div>
        </div>
        ${seatsHTML}
      </div>
      ${renderResultBanner(t)}
      ${humanTurn && t.cfg.isTournament ? renderDecisionClock(t) : ''}
      <div class="action-bar">${actionHTML}</div>
      ${humanTurn ? `<div class="muted" style="text-align:center; font-size:0.72rem; margin-top:4px;">Keys: <b>Z</b> fold &middot; <b>X</b> check/call &middot; <b>C</b> half-pot &middot; <b>V</b> pot &middot; <b>B</b> all-in</div>` : ''}
      <div class="log-box">${t.log.map(l=>`<div>${l}</div>`).join('')}</div>
    </div>`;
}

function wirePlayEvents(){
  const modeCash = document.getElementById('modeCash');
  if(modeCash) modeCash.addEventListener('click', ()=>{ state.playMode='cash'; render(); });
  const modeTournament = document.getElementById('modeTournament');
  if(modeTournament) modeTournament.addEventListener('click', ()=>{ state.playMode='tournament'; render(); });
  const modeCareer = document.getElementById('modeCareer');
  if(modeCareer) modeCareer.addEventListener('click', ()=>{ state.playMode='career'; render(); });

/* ---------------- Shared action functions — used by both click handlers and
   keyboard shortcuts, so the two input paths can never compute different amounts. ---------------- */
function doFold(){ humanAction('fold'); }
function doCheckCall(){
  const t = state.table;
  if(t && t.cfg.forcedThrow) return; // laying this event down — Fold is the only legal action, closes the keyboard-shortcut path too
  humanAction('check'); // 'check' auto-converts to 'call' inside applyAction when a bet is outstanding
}
function doHalfPotBet(){
  const t = state.table, human = t && t.players.find(p=>p.id===0);
  if(!t || !human) return;
  if(t.cfg.forcedThrow) return;
  const pot = t.pot || t.cfg.bigBlind*2;
  humanAction(t.currentBet>0?'raise':'bet', human.currentBet + (t.currentBet-human.currentBet) + Math.round(pot*0.5));
}
function doPotBet(){
  const t = state.table, human = t && t.players.find(p=>p.id===0);
  if(!t || !human) return;
  if(t.cfg.forcedThrow) return;
  const pot = t.pot || t.cfg.bigBlind*2;
  humanAction(t.currentBet>0?'raise':'bet', human.currentBet + (t.currentBet-human.currentBet) + pot);
}
function doAllIn(){
  const t = state.table, human = t && t.players.find(p=>p.id===0);
  if(!t || !human) return;
  if(t.cfg.forcedThrow) return;
  humanAction(t.currentBet>0?'raise':'bet', human.currentBet+human.stack);
}

/* ---------------- Keyboard shortcuts for Play mode — same scheme convention as the
   Blackjack trainer (number row as primary, a letter as a secondary/muscle-memory key),
   printed directly on the action buttons. Enter/Space deals or advances to the next hand. ---------------- */
function handlePlayKeydown(e){
  if(state.activeTab!=='play') return;
  const t = state.table;
  if(!t) return;
  const tag = (e.target && e.target.tagName) || '';
  if(tag==='INPUT' || tag==='SELECT' || tag==='TEXTAREA') return; // never hijack typing into a form field
  const key = e.key.toLowerCase();

  if((key==='enter' || key===' ') && (t.stage==='idle' || t.stage==='showdown')){
    const tourDone = (t.cfg.mtt && state.mtt && state.mtt.complete) || (t.cfg.isTournament && !t.cfg.mtt && t.tournament && t.tournament.complete);
    if(tourDone) return; // completion screens have their own buttons, not a "next hand"
    e.preventDefault();
    startHand(t);
    return;
  }

  const humanTurn = t.actingIdx===0 && !t.waiting && t.stage!=='idle' && t.stage!=='showdown';
  if(!humanTurn) return;

  if(key==='1' || key==='z'){ e.preventDefault(); doFold(); }
  else if(key==='2' || key==='x'){ e.preventDefault(); doCheckCall(); }
  else if(key==='3' || key==='c'){ e.preventDefault(); doHalfPotBet(); }
  else if(key==='4' || key==='v'){ e.preventDefault(); doPotBet(); }
  else if(key==='5' || key==='b'){ e.preventDefault(); doAllIn(); }
}

/* Home-row tab-switching (A/S/D/F/G/H/J/K/L, matching the Blackjack trainer's convention),
   plus generic drill-answer/next shortcuts that work across every skill tab without bespoke
   per-drill key logic: number keys click the Nth visible ".drill-answer" button, Enter/Space
   clicks whichever ".drill-next" button is currently on screen. Both are purely DOM-driven, so
   they automatically stay correct as drills change state — there's nothing to keep in sync. */
const TAB_HOTKEYS = {a:'play', s:'terms', d:'potodds', f:'ranges', g:'bluff', h:'preflop', j:'stats', n:'variants', i:'image', t:'test', k:'manual', l:'options'};

function handleGlobalKeydown(e){
  const tag = (e.target && e.target.tagName) || '';
  if(tag==='INPUT' || tag==='SELECT' || tag==='TEXTAREA') return;
  const key = e.key.toLowerCase();

  if(TAB_HOTKEYS[key] && !e.ctrlKey && !e.metaKey && !e.altKey){
    e.preventDefault();
    switchTab(TAB_HOTKEYS[key]);
    return;
  }

  if(['1','2','3','4'].includes(key)){
    const buttons = document.querySelectorAll('.drill-answer:not(:disabled)');
    const idx = parseInt(key,10) - 1;
    if(buttons[idx]){ e.preventDefault(); buttons[idx].click(); return; }
  }
  if(key==='enter' || key===' '){
    const nextBtn = document.querySelector('.drill-next');
    if(nextBtn){ e.preventDefault(); nextBtn.click(); return; }
  }
}

/* =========================================================
   TERMINOLOGY DRILL
   ========================================================= */
const TERMS = [
  {term:'Pot Odds', def:'The ratio of the current bet you must call to the total size of the pot, used to decide if a call is profitable.'},
  {term:'Equity', def:"Your hand's probability of winning the pot at showdown, expressed as a percentage."},
  {term:'Range', def:"The full set of hands a player could plausibly hold in a given spot, based on their actions so far."},
  {term:'Position', def:'Where you act relative to the dealer button; acting later gives you more information than acting earlier.'},
  {term:'3-Bet', def:'The second re-raise in a betting sequence (the first raise counts as the "2-bet").'},
  {term:'C-Bet (Continuation Bet)', def:'A bet made by the preflop raiser on the flop, continuing the aggression regardless of how the flop hit.'},
  {term:'Check-Raise', def:'Checking with the intention of raising after an opponent bets, often used to build a bigger pot or represent strength.'},
  {term:'Blockers', def:"Holding a card that reduces the number of combinations an opponent can have of a specific hand, especially useful for bluffing decisions."},
  {term:'GTO (Game Theory Optimal)', def:'A balanced strategy designed to be unexploitable, regardless of how opponents adjust to it.'},
  {term:'Exploitative Play', def:"Deviating from balanced play to target a specific opponent's tendencies for maximum profit."},
  {term:'Implied Odds', def:'The extra money you expect to win on future streets if you hit your draw, factored into a call that pot odds alone don\u2019t justify.'},
  {term:'Fold Equity', def:'The added value a bet or raise has purely from the chance it makes your opponent fold, on top of your equity if called.'},
  {term:'Pot-Committed', def:"A situation where so much of your stack is already in the pot that folding to a further bet no longer makes sense."},
  {term:'The Button', def:'The dealer position, which acts last on every postflop betting round and therefore has the biggest positional advantage.'},
  {term:'Blinds (SB/BB)', def:'Forced bets posted by the two players left of the button before cards are dealt, seeding the pot each hand.'},
  {term:'Suited Connectors', def:'Two cards of the same suit with consecutive ranks (like 8&#9829;9&#9829;), valued for their straight and flush potential.'},
  {term:'Kicker', def:'A side card that breaks ties between otherwise equal hands, such as two players both holding a pair of Kings.'},
  {term:'The Nuts', def:'The best possible hand given the current board, impossible for any hand to beat.'},
  {term:'Drawing Dead', def:'A situation where no remaining card can make your hand a winner, even if it completes your draw.'},
  {term:'Semi-Bluff', def:"Betting or raising a hand that isn't currently the best hand, but that has a strong chance to improve to the best hand if called."},
  {term:'Combos (Combinations)', def:'The distinct two-card ways a specific starting hand can be dealt \u2014 6 for a pocket pair, 4 for a suited hand, and 12 for an offsuit hand, before removing any blocked by cards you can see.'},
];

function pickTermQuestion(){
  const idx = Math.floor(Math.random()*TERMS.length);
  const correct = TERMS[idx];
  const distractors = shuffle(TERMS.filter(t=>t!==correct)).slice(0,3);
  const choices = shuffle([correct, ...distractors].map(t=>t.def));
  return {term:correct.term, correctDef:correct.def, choices};
}

function renderTerms(){
  if(!state.quiz.current){ state.quiz.current = pickTermQuestion(); state.quiz.answered = false; }
  const q = state.quiz.current;
  const modeButtons = `
    <div class="btn-row" style="margin-top:12px;">
      <button class="btn${state.quiz.mode==='quiz'?' primary':''}" id="termsModeQuiz" title="Test yourself with multiple-choice questions on all 21 terms">Quiz Mode</button>
      <button class="btn${state.quiz.mode==='glossary'?' primary':''}" id="termsModeGlossary" title="Read every term and definition in one alphabetized list before being tested">Study Glossary</button>
    </div>`;

  if(state.quiz.mode==='glossary'){
    const sorted = TERMS.slice().sort((a,b)=>a.term.localeCompare(b.term));
    return `
      <div class="card-box">
        <h2>Terminology</h2>
        <div class="muted">All ${TERMS.length} terms used across this trainer's drills. Read through here first, then switch to Quiz Mode to test yourself.</div>
        ${modeButtons}
        <div style="margin-top:16px;">
          ${sorted.map(t=>`
            <div style="border-bottom:1px solid var(--panel-line); padding:12px 0;">

              <div class="muted" style="margin-top:4px;">${t.def}</div>
            </div>`).join('')}
        </div>
      </div>`;
  }

  return `
    <div class="card-box">
      <h2>Terminology Drill</h2>
      <div class="muted">Match the term to its correct definition. Fluency with this vocabulary makes every other skill in this trainer easier to learn. New to these terms? Switch to Study Glossary first.</div>
      ${modeButtons}
      <div class="score-tag" style="margin-top:12px;">Score: ${state.quiz.score} / ${state.quiz.total}</div>
      <h3 style="margin-top:16px; color:var(--gold-bright);">${q.term}</h3>
      <div id="quizChoices">
        ${q.choices.map((c,i)=>`<button class="quiz-choice drill-answer" data-i="${i}">${c}</button>`).join('')}
      </div>
      <div class="btn-row"><button class="btn primary drill-next" id="btnNextTerm" ${state.quiz.answered?'':'disabled'}>Next Term</button></div>
    </div>`;
}

function wireTermsEvents(){
  const modeQuiz = document.getElementById('termsModeQuiz');
  if(modeQuiz) modeQuiz.addEventListener('click', ()=>{ state.quiz.mode='quiz'; render(); });
  const modeGlossary = document.getElementById('termsModeGlossary');
  if(modeGlossary) modeGlossary.addEventListener('click', ()=>{ state.quiz.mode='glossary'; render(); });
  document.querySelectorAll('#quizChoices .quiz-choice').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(state.quiz.answered) return;
      const q = state.quiz.current;
      const chosen = btn.textContent;
      state.quiz.answered = true;
      state.quiz.total++;
      const isCorrect = chosen===q.correctDef;
      if(isCorrect) state.quiz.score++;
      recordDrillAnswer(isCorrect);
      isCorrect ? sfxCorrect() : sfxWrong();
      document.querySelectorAll('#quizChoices .quiz-choice').forEach(b=>{
        if(b.textContent===q.correctDef) b.classList.add('correct');
        else if(b===btn) b.classList.add('incorrect');
        b.disabled = true;
      });
      document.getElementById('btnNextTerm').disabled = false;
    });
  });
  const nextBtn = document.getElementById('btnNextTerm');
  if(nextBtn) nextBtn.addEventListener('click', ()=>{
    state.quiz.current = pickTermQuestion();
    state.quiz.answered = false;
    render();
  });
}

/* =========================================================
   POT ODDS & EQUITY DRILL
   ========================================================= */
function randomHoleCards(deck){ return [deck.pop(), deck.pop()]; }

function generatePotOddsScenario(){
  const deck = shuffle(buildDeck());
  const hero = randomHoleCards(deck);
  const stageRoll = Math.random();
  let boardCount = 0;
  if(stageRoll<0.3) boardCount=0; else if(stageRoll<0.65) boardCount=3; else if(stageRoll<0.85) boardCount=4; else boardCount=5;
  const board = [];
  for(let i=0;i<boardCount;i++) board.push(deck.pop());
  const potBefore = [20,30,50,75,100][Math.floor(Math.random()*5)];
  const bet = Math.round(potBefore * (0.33 + Math.random()*0.9));
  const requiredEquity = bet/(potBefore + bet*2);
  return {hero, board, potBefore, bet, requiredEquity, actualEquity:null, decided:null};
}

/* =========================================================
   RULE OF 2 AND 4 — an isolated, single-concept flash-card drill (the
   Hold'em analogue of Blackjack's standalone Flash Cards mode): a fast
   mental-math shortcut for estimating equity from an out count, distinct
   from the Monte-Carlo-simulated real equity used elsewhere in this tab.
   Canonical draw types with well-established out counts, since a fully
   general outs-counter would need to assume what beats an unknown
   opponent — this teaches the shortcut the way it's actually taught.
   ========================================================= */
const OUTS_SCENARIOS = [
  {name:'Flush draw', outs:9},
  {name:'Open-ended straight draw', outs:8},
  {name:'Gutshot straight draw', outs:4},
  {name:'Two overcards', outs:6},
  {name:'One pair drawing to trips', outs:2},
  {name:'Flush draw + gutshot combo', outs:12},
  {name:'Open-ended straight draw + flush draw combo', outs:15},
];
function generateOutsQuestion(){
  const scenario = OUTS_SCENARIOS[Math.floor(Math.random()*OUTS_SCENARIOS.length)];
  const twoCardsToCome = Math.random()<0.5;
  const mult = twoCardsToCome ? 4 : 2;
  const correct = scenario.outs * mult;
  const wrongMult = twoCardsToCome ? 2 : 4;
  const pool = new Set([correct, scenario.outs*wrongMult, scenario.outs, correct+8]);
  let opts = shuffle([...pool]).slice(0, Math.min(4, pool.size));
  if(!opts.includes(correct)) opts[0] = correct;
  opts = shuffle(opts);
  return {scenario, twoCardsToCome, mult, correct, options:opts, answered:false, userChoice:null};
}

/* =========================================================
   PREFLOP POSITION — opening ranges by seat
   Ranked using the Chen Formula, a well-established heuristic for
   ordering all 169 starting hands by preflop strength. Seat "opening
   %" values below are standard, commonly-cited tight-aggressive
   frequencies for teaching the SHAPE of a range (tighter early,
   wider late) — they are simplified, not a solved GTO output.
   ========================================================= */
function chLabel(r){ return r===10 ? 'T' : rankLabel(r); }
function chenCardVal(r){
  if(r===14) return 10; if(r===13) return 8; if(r===12) return 7; if(r===11) return 6;
  return r/2;
}
function chenScore(hi, lo, suited){
  if(hi===lo) return Math.max(chenCardVal(hi)*2, 5);
  let score = chenCardVal(hi);
  if(suited) score += 2;
  const gap = hi - lo - 1;
  if(gap===0) score += 0;
  else if(gap===1) score -= 1;
  else if(gap===2) score -= 2;
  else if(gap===3) score -= 4;
  else score -= 5;
  if(gap<=1 && hi<=12) score += 1; // straight-potential bonus, connectors Q-high or lower
  return Math.ceil(score);
}
function buildHandTypes(){
  const RANKS=[14,13,12,11,10,9,8,7,6,5,4,3,2];
  const types=[];
  for(let a=0;a<13;a++){
    const hi = RANKS[a];
    types.push({label:chLabel(hi)+chLabel(hi), hi, lo:hi, suited:false, isPair:true, combos:6, score:chenScore(hi,hi,false)});
    for(let b=a+1;b<13;b++){
      const lo = RANKS[b];
      types.push({label:chLabel(hi)+chLabel(lo)+'s', hi, lo, suited:true, isPair:false, combos:4, score:chenScore(hi,lo,true)});
      types.push({label:chLabel(hi)+chLabel(lo)+'o', hi, lo, suited:false, isPair:false, combos:12, score:chenScore(hi,lo,false)});
    }
  }
  types.sort((x,y)=>{
    if(y.score!==x.score) return y.score-x.score;
    const cat = t=> t.isPair?2:(t.suited?1:0);
    if(cat(y)!==cat(x)) return cat(y)-cat(x);
    if(y.hi!==x.hi) return y.hi-x.hi;
    return y.lo-x.lo;
  });
  let running=0;
  types.forEach(t=>{ running += t.combos; t.cumPct = running/1326*100; });
  return types;
}
const HAND_TYPES = buildHandTypes();
const HAND_TYPE_MAP = {}; HAND_TYPES.forEach(t=>HAND_TYPE_MAP[t.label]=t);

/* Short-Deck preflop ranking — built from REAL empirical equity via Monte Carlo (reusing the
   already-tested short-deck-aware estimateEquity), rather than guessing at Chen formula weight
   adjustments for a 36-card game. Only 81 hand types exist (9 ranks instead of 13), and 630 total
   combos (C(36,2)) instead of 1326. Computed lazily and cached on first use, since it takes ~1-2s —
   not something to block initial page load for a feature most sessions won't touch.  */
let SHORT_DECK_HAND_TYPES_CACHE = null;
function buildShortDeckHandTypes(){
  const RANKS_SD = [14,13,12,11,10,9,8,7,6];
  const types = [];
  for(let a=0;a<9;a++){
    const hi = RANKS_SD[a];
    types.push({label:chLabel(hi)+chLabel(hi), hi, lo:hi, suited:false, isPair:true, combos:6});
    for(let b=a+1;b<9;b++){
      const lo = RANKS_SD[b];
      types.push({label:chLabel(hi)+chLabel(lo)+'s', hi, lo, suited:true, isPair:false, combos:4});
      types.push({label:chLabel(hi)+chLabel(lo)+'o', hi, lo, suited:false, isPair:false, combos:12});
    }
  }
  types.forEach(t=>{
    const hero = t.isPair ? [{r:t.hi,s:'s'},{r:t.hi,s:'h'}] : [{r:t.hi,s:'s'},{r:t.lo, s: t.suited?'s':'h'}];
    t.equity = estimateEquity(hero, [], 200, buildShortDeck, true);
  });
  types.sort((x,y)=> y.equity - x.equity);
  let running = 0;
  const totalCombos = 9*6 + 36*4 + 36*12; // 630, matches C(36,2)
  types.forEach(t=>{ running += t.combos; t.cumPct = running/totalCombos*100; });
  return types;
}
function getShortDeckHandTypes(){
  if(!SHORT_DECK_HAND_TYPES_CACHE) SHORT_DECK_HAND_TYPES_CACHE = buildShortDeckHandTypes();
  return SHORT_DECK_HAND_TYPES_CACHE;
}
function shortDeckHandTypeMap(){
  const map = {};
  getShortDeckHandTypes().forEach(t=>map[t.label]=t);
  return map;
}
